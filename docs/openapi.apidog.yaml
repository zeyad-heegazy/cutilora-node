            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - tenant_owner
                    - tenant_admin
                    - billing_admin
                    - clinic_admin
                    - clinic_manager
                    - branch_manager
                    - staff
                    - provider
                    - receptionist
                    - custom
                customRoleId:
                  type: string
                  nullable: true
                permissionOverrides:
                  type: object
                  properties:
                    allow:
                      type: array
                      items:
