  /tenant/documents:
    get:
      tags:
        - Tenant Organization
      summary: List organization documents
      description: Lists active documents belonging to the active tenant. File contents and storage keys are never included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant document metadata list
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Tenant Organization
      summary: Upload organization document
      description: Uploads a private PDF, JPEG, PNG or WebP document using base64. The file is content-sniffed and limited to 3 MB. Documents are stored outside the public uploads directory.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category
                - fileBase64
              properties:
                name:
                  type: string
                  maxLength: 180
                category:
                  type: string
                  enum:
                    - registration
                    - tax
                    - license
                    - insurance
                    - contract
                    - other
                fileBase64:
                  type: string
                  description: Base64 file or supported data URL; maximum decoded size 3 MB
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '201':
          description: Document uploaded
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tenant/documents/{documentId}:
    get:
      tags:
        - Tenant Organization
