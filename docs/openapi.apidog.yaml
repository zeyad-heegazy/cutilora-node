                  data:
                    type: object
                    properties:
                      paymentMethod:
                        type: object
                        nullable: true
                        properties:
                          provider:
                            type: string
                          type:
                            type: string
                          brand:
                            type: string
                          last4:
                            type: string
                            maxLength: 4
                          expiryMonth:
                            type: integer
                            nullable: true
                          expiryYear:
                            type: integer
                            nullable: true
                          updatedAt:
                            type: string
                            format: date-time
                            nullable: true
                      paymentRecovery:
                        type: object
                        nullable: true
                        properties:
                          failedAt:
                            type: string
                            format: date-time
                            nullable: true
                          failureCode:
                            type: string
                          retryAt:
                            type: string
                            format: date-time
                            nullable: true
                          retryCount:
                            type: integer
                          gracePeriodEndsAt:
                            type: string
                            format: date-time
                            nullable: true
                          suspensionAt:
                            type: string
                            format: date-time
                            nullable: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenant/subscription/usage:
    get:
      tags:
        - Tenant Subscription
