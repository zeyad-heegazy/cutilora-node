  /tenant/branches/{branchId}/business-hours:
    get:
      tags:
        - Branches
      x-apidog-folder: Tenant/Branches
      summary: Get branch business hours
      description: Returns the branch timezone and weekly operating schedule. Branch-scoped users can only read their selected branch.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ClinicIdRequired'
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Branch business hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      timezone:
                        type: string
                      operatingHours:
                        type: array
                        items:
                          $ref: '#/components/schemas/OperatingHoursDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Branches
      x-apidog-folder: Tenant/Branches
      summary: Replace branch weekly business hours
      description: Replaces the complete weekly schedule. Exactly seven entries are required, one for every weekday (0-6); mark closed days with isClosed=true. Open days require either one legacy open/close window or one to three non-overlapping split shifts; breaks must be contained within their shift. Overnight hours are not supported. Requires branch.schedule.manage permission.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ClinicIdRequired'
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operatingHours
              properties:
                operatingHours:
                  type: array
                  maxItems: 7
                  items:
                    $ref: '#/components/schemas/OperatingHoursDay'
      responses:
        '200':
          description: Updated branch business hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      timezone:
                        type: string
                      operatingHours:
                        type: array
                        items:
                          $ref: '#/components/schemas/OperatingHoursDay'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
