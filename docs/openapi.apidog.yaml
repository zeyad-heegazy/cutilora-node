components:
  securitySchemes:
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform administrator access token. In Apidog, read the token from the platform_token environment variable.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Active tenant ID.
      schema:
        type: string
    ClinicId:
      name: X-Clinic-Id
      in: header
      required: false
      description: Active clinic ID.
      schema:
        type: string
    ClinicIdRequired:
      name: X-Clinic-Id
      in: header
      required: true
      description: Required for branch endpoints.
      schema:
        type: string
    BranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: Optional branch scope; requires X-Clinic-Id. Required for branch-scoped memberships.
      schema:
        type: string
    GeoResource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum:
          - countries
          - governorates
          - cities
          - districts
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    Search:
      name: search
      in: query
      description: Case-insensitive match against English name, Arabic name, or code.
      schema:
        type: string
        maxLength: 100
  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: ok
    UserSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        platform_role:
          type: string
          nullable: true
    MembershipSummary:
      type: object
      properties:
        tenant:
          type: string
        clinic:
          type: string
          nullable: true
        branch_ids:
          type: array
          items:
            type: string
        scope:
          type: string
          enum:
            - tenant
            - clinic
            - branch
        role:
          type: string
    TenantAccess:
      type: object
      properties:
        tenantId:
          type: string
        clinicId:
          type: string
          nullable: true
        branchId:
          type: string
          nullable: true
        role:
          type: string
        scope:
          type: string
          enum:
            - tenant
            - clinic
            - branch
    BusinessContact:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        alternatePhone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
    BusinessAddress:
      type: object
      properties:
        countryId:
          type: string
          nullable: true
        governorateId:
          type: string
          nullable: true
        cityId:
          type: string
          nullable: true
        districtId:
          type: string
          nullable: true
        addressLine1:
          type: string
        addressLine2:
          type: string
        building:
          type: string
        floor:
          type: string
        unit:
          type: string
        landmark:
          type: string
        postalCode:
