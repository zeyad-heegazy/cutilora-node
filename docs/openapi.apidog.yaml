  /tenant/subscription/change-requests:
    get:
      tags:
        - Tenant Subscription
      summary: List subscription change requests
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant's subscription change requests
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Tenant Subscription
      summary: Request a subscription change
      description: Creates a request for Platform review. It does not change plan, price, payment state or subscription status.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum:
                    - upgrade
                    - downgrade
                    - cancel
                    - reactivate
                targetPlanCode:
                  type: string
                  maxLength: 60
                targetBillingCycle:
                  type: string
                  enum:
                    - monthly
                    - quarterly
                    - yearly
                effectiveAt:
                  type: string
                  enum:
                    - immediate
                    - period_end
                  default: period_end
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Request submitted for Platform review
        '403':
          $ref: '#/components/responses/Forbidden'
