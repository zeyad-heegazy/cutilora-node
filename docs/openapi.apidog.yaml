              properties:
                name:
                  type: string
                  minLength: 2
                slug:
                  type: string
                  pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                address:
                  type: string
                cityId:
                  type: string
                timezone:
                  type: string
                  default: Africa/Cairo
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /platform/monitoring/view:
    get:
      tags:
        - Platform - Monitoring
      summary: Open monitoring dashboard
      description: Serves the browser-based dashboard. Log API endpoints require platform authentication.
      responses:
        '200':
          description: Monitoring dashboard HTML
          content:
            text/html:
              schema:
                type: string
  /platform/monitoring/logs:
    get:
      tags:
        - Platform - Monitoring
      summary: List application logs
      security:
        - platformBearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: level
          in: query
          schema:
            type: string
            enum:
              - debug
              - info
              - warn
              - error
              - fatal
        - name: category
          in: query
          schema:
            type: string
            enum:
              - http
              - auth
              - authorization
              - database
              - business
              - security
              - system
              - application
        - name: module
          in: query
          schema:
            type: string
        - name: statusCode
          in: query
          schema:
            type: integer
            minimum: 100
            maximum: 599
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: from
          in: query
          description: Inclusive ISO-8601 date/time
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive ISO-8601 date/time
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Matching log records and pagination data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    description: Log list and pagination result
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/monitoring/logs/stats:
    get:
      tags:
        - Platform - Monitoring
      summary: Get log statistics
      security:
        - platformBearerAuth: []
      parameters:
        - name: from
          in: query
          description: Inclusive ISO-8601 date/time; defaults to seven days before to
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive ISO-8601 date/time; defaults to current time
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Log statistics for the requested date range
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/monitoring/logs/timeline:
    get:
      tags:
        - Platform - Monitoring
      summary: Get log timeline statistics
      description: Currently returns the same aggregate statistics payload as the stats endpoint, not time-bucketed points.
      security:
        - platformBearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Aggregate log statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /platform/monitoring/logs/{id}:
    get:
      tags:
        - Platform - Monitoring
      summary: Get a log entry
      security:
        - platformBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Log entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform administrator access token. In Apidog, read the token from the platform_token environment variable.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Active tenant ID.
      schema:
        type: string
    ClinicId:
      name: X-Clinic-Id
      in: header
      required: false
      description: Active clinic ID.
      schema:
        type: string
    ClinicIdRequired:
      name: X-Clinic-Id
      in: header
      required: true
      description: Required for branch endpoints.
      schema:
        type: string
    BranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: Optional branch scope; requires X-Clinic-Id.
      schema:
        type: string
    GeoResource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum:
          - countries
          - governorates
          - cities
          - districts
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    Search:
      name: search
      in: query
      description: Case-insensitive match against English name, Arabic name, or code.
      schema:
        type: string
        maxLength: 100
  schemas:
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: ok
    UserSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        platform_role:
          type: string
          nullable: true
    MembershipSummary:
      type: object
      properties:
        tenant:
          type: string
        clinic:
          type: string
          nullable: true
        branch_ids:
          type: array
          items:
            type: string
        scope:
          type: string
          enum:
            - tenant
            - clinic
            - branch
        role:
          type: string
    TenantAccess:
      type: object
      properties:
        tenantId:
          type: string
        clinicId:
          type: string
          nullable: true
        branchId:
          type: string
          nullable: true
        role:
          type: string
        scope:
          type: string
          enum:
            - tenant
            - clinic
            - branch
    BusinessContact:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        alternatePhone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
    BusinessAddress:
      type: object
      properties:
        countryId:
          type: string
          nullable: true
        governorateId:
          type: string
          nullable: true
        cityId:
          type: string
          nullable: true
        districtId:
          type: string
          nullable: true
        addressLine1:
          type: string
        addressLine2:
          type: string
        building:
          type: string
        floor:
          type: string
        unit:
          type: string
        landmark:
          type: string
        postalCode:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
    TenantLegal:
      type: object
      properties:
        taxNumber:
          type: string
        vatNumber:
          type: string
        commercialRegistrationNumber:
          type: string
    Branding:
      type: object
      properties:
        logoUrl:
          type: string
        coverImageUrl:
          type: string
        primaryColor:
          type: string
    TenantPreferences:
      type: object
      properties:
        timezone:
          type: string
        locale:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        dateFormat:
          type: string
        weekStartsOn:
          type: integer
          minimum: 0
          maximum: 6
        supportedLanguages:
          type: array
          items:
            type: string
    Tenant:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        displayName:
          type: string
        legalName:
          type: string
        slug:
          type: string
        businessType:
          type: string
          enum:
            - single_clinic
            - clinic_group
            - medical_center
        description:
          type: string
        industry:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
        contact:
          $ref: '#/components/schemas/BusinessContact'
        address:
          $ref: '#/components/schemas/BusinessAddress'
        legal:
          type: object
          properties:
            taxNumber:
              type: string
            vatNumber:
              type: string
            commercialRegistrationNumber:
              type: string
        branding:
          type: object
          properties:
            logoUrl:
              type: string
            coverImageUrl:
              type: string
            primaryColor:
              type: string
        preferences:
          type: object
          properties:
            timezone:
              type: string
            locale:
              type: string
            currency:
              type: string
            dateFormat:
              type: string
            weekStartsOn:
              type: integer
            supportedLanguages:
              type: array
              items:
                type: string
        settings:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TenantUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        displayName:
          type: string
          maxLength: 160
        legalName:
          type: string
          maxLength: 200
        businessType:
          type: string
          enum:
            - single_clinic
            - clinic_group
            - medical_center
        description:
          type: string
          maxLength: 2000
        industry:
          type: string
        contact:
          $ref: '#/components/schemas/BusinessContact'
        address:
          $ref: '#/components/schemas/BusinessAddress'
        legal:
          type: object
          additionalProperties: true
        branding:
          type: object
          additionalProperties: true
        preferences:
          type: object
          additionalProperties: true
        settings:
          type: object
          additionalProperties: true
    ClinicInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        code:
          type: string
          maxLength: 30
        clinicType:
          type: string
          enum:
            - dermatology
            - aesthetic
            - beauty
            - medical_center
            - other
        description:
          type: string
          maxLength: 2000
        specialties:
          type: array
          items:
            type: string
        contact:
          $ref: '#/components/schemas/BusinessContact'
        address:
          $ref: '#/components/schemas/BusinessAddress'
        timezone:
          type: string
          default: Africa/Cairo
        countryId:
          type: string
        governorateId:
          type: string
        cityId:
          type: string
        districtId:
          type: string
        operatingHours:
          type: array
          maxItems: 7
          items:
            type: object
            required:
              - dayOfWeek
            properties:
              dayOfWeek:
                type: integer
                minimum: 0
                maximum: 6
              isClosed:
                type: boolean
              openTime:
                type: string
              closeTime:
                type: string
              breakTimes:
                type: array
                items:
                  type: object
                  properties:
                    startTime:
                      type: string
                    endTime:
                      type: string
        branding:
          type: object
          additionalProperties: true
        bookingSettings:
          type: object
          properties:
            allowOnlineBooking:
              type: boolean
            requireAppointmentConfirmation:
              type: boolean
            defaultAppointmentDurationMinutes:
              type: integer
              minimum: 5
              maximum: 480
            bufferMinutes:
              type: integer
              minimum: 0
              maximum: 240
            cancellationWindowHours:
              type: integer
              minimum: 0
              maximum: 720
        openingDate:
          type: string
          format: date
          nullable: true
        settings:
          type: object
          additionalProperties: true
    ClinicUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
