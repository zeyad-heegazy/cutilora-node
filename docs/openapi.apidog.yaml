  /tenant/dashboard/summary:
    get:
      tags:
        - Tenant Dashboard
      summary: Get tenant dashboard summary
      description: Returns organization identity, tenant-scoped clinic/branch/member counts and the current Cutilora subscription summary. Counts include only records owned by the active tenant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant dashboard summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      organization:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          status:
                            type: string
                            enum:
                              - active
                              - suspended
                      counts:
                        type: object
                        properties:
                          clinics:
                            type: object
                            properties:
                              total:
                                type: integer
                              active:
                                type: integer
                              suspended:
                                type: integer
                          branches:
                            type: object
                            properties:
                              total:
                                type: integer
                              active:
                                type: integer
                              suspended:
                                type: integer
                          activeMembers:
                            type: integer
                          pendingInvitations:
                            type: integer
                      subscription:
                        type: object
                        nullable: true
                        properties:
                          plan:
                            type: object
                            additionalProperties: true
                          billingCycle:
                            type: string
                          status:
                            type: string
                          nextBillingAt:
                            type: string
                            format: date-time
                            nullable: true
                      generatedAt:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
