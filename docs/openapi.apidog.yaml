                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Replacement document version created
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
