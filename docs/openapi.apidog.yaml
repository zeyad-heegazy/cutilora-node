      summary: List branches in current clinic
      description: X-Clinic-Id is required. If X-Branch-Id is supplied, results are restricted to that branch.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ClinicIdRequired'
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Branch list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Clinic - Branches
      summary: Create branch in current clinic
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ClinicIdRequired'
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
