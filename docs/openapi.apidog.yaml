            type: string
      responses:
        '200':
          description: Branch suspended
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /tenant/branches/{branchId}/temporary-close:
    post:
      tags:
        - Branches
      x-apidog-folder: Tenant/Branches
      summary: Temporarily close a branch
      description: Moves an active branch to temporarily_closed. Reactivate with POST /activate. This is a manual lifecycle state; no automatic reopening is scheduled. Requires branch.lifecycle.manage.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ClinicIdRequired'
        - name: branchId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Branch temporarily closed
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tenant/branches/{branchId}/close:
    post:
      tags:
        - Branches
