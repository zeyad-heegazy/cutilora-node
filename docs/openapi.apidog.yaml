openapi: 3.0.3
info:
  title: Cutilora API
  version: 1.0.0
  description: |
    API documentation for the Cutilora Node.js backend.
    Base path: /api/v1.
    Authentication uses Bearer access tokens.
    Tenant-scoped endpoints require X-Tenant-Id. X-Clinic-Id and X-Branch-Id
    select optional clinic and branch context; branch context requires clinic context.
    The development bootstrap endpoint is unavailable when NODE_ENV=production.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (replace with deployed API URL)
tags:
  - name: Health
  - name: Tenant - Authentication
  - name: Platform - Authentication
  - name: Platform - Tenants
  - name: Platform - Geo
  - name: Platform - Monitoring
  - name: Tenant - Context
  - name: Tenant - Geo
  - name: Tenant - Clinics
  - name: Tenant - Branches
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/login:
    post:
      tags:
        - Clinic - Authentication
      summary: Log in
      description: Returns an access token and the user's active tenant memberships.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: your-password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
                      user:
                        $ref: '#/components/schemas/UserSummary'
                      memberships:
                        type: array
                        items:
                          $ref: '#/components/schemas/MembershipSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/me:
    get:
      tags:
        - Clinic - Authentication
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user and active memberships
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        description: User record (password hash is not exposed)
                      memberships:
                        type: array
                        items:
                          type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/platform/login:
    post:
      tags:
        - Platform - Authentication
      summary: Platform administrator login
      description: Issues a platform-audience access token only to an active platform administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Platform login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
                      user:
                        $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/platform/me:
    get:
      tags:
        - Platform - Authentication
      summary: Get current platform administrator
      security:
        - platformBearerAuth: []
      responses:
        '200':
          description: Current platform identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/platform/dev/bootstrap-admin:
    post:
      tags:
        - Platform - Authentication
      summary: Bootstrap the first platform administrator
      description: Development/test only. Route is not registered in production. Can be used only while no platform admin exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 12
      responses:
        '201':
          description: Platform admin created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                        format: email
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /platform/tenants:
    get:
      tags:
        - Platform - Tenants
      summary: List tenants
      security:
        - platformBearerAuth: []
      responses:
        '200':
          description: Tenant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Platform - Tenants
      summary: Create tenant and owner
      description: Tenant and optional first clinic are created together. Slugs are generated by the server. Subscription is managed separately after tenant creation.
      security:
        - platformBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - owner
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 160
                displayName:
                  type: string
                  maxLength: 160
                legalName:
                  type: string
                  maxLength: 200
                businessType:
                  type: string
                  enum:
                    - single_clinic
                    - clinic_group
                    - medical_center
                  default: single_clinic
                description:
                  type: string
                  maxLength: 2000
                industry:
                  type: string
                  example: aesthetic_medicine
                contact:
                  $ref: '#/components/schemas/BusinessContact'
                address:
                  $ref: '#/components/schemas/BusinessAddress'
                legal:
                  $ref: '#/components/schemas/TenantLegal'
                branding:
                  $ref: '#/components/schemas/Branding'
                preferences:
                  $ref: '#/components/schemas/TenantPreferences'
                settings:
                  type: object
                  additionalProperties: true
                owner:
                  type: object
                  required:
                    - name
                    - email
                    - password
                  properties:
                    name:
                      type: string
                      minLength: 2
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      format: password
                      minLength: 12
                initialClinic:
                  allOf:
                    - $ref: '#/components/schemas/ClinicInput'
                  description: Optional first clinic; its slug is generated by the server.
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /platform/tenants/{tenantId}:
    get:
      tags:
        - Platform - Tenants
      summary: Get tenant details
      description: Returns tenant profile, all clinics, and its current subscription with payment history.
      security:
        - platformBearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Tenant'
                      - type: object
                        properties:
                          clinics:
                            type: array
                            items:
                              $ref: '#/components/schemas/Clinic'
                          subscription:
                            allOf:
                              - $ref: '#/components/schemas/Subscription'
                            nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Platform - Tenants
      summary: Partially update tenant profile
      description: All supplied fields are updated. Nested objects are merged. Changing name regenerates the server-controlled slug.
      security:
        - platformBearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: Tenant updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /platform/tenants/{tenantId}/status:
    patch:
      tags:
        - Platform - Tenants
      summary: Update tenant status
      security:
        - platformBearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - suspended
      responses:
        '200':
          description: Tenant status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/TenantDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /platform/tenants/{tenantId}/subscription:
    put:
      tags:
        - Platform - Tenants
      summary: Create or replace tenant subscription
      description: Stores the commercial subscription snapshot. No payment gateway is charged by this endpoint.
      security:
        - platformBearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionInput'
      responses:
        '200':
          description: Subscription saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Subscription'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /platform/tenants/{tenantId}/subscription/payments:
    post:
      tags:
        - Platform - Tenants
      summary: Record a subscription payment
      description: Appends a payment record to subscription history; this does not initiate a payment.
      security:
        - platformBearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPaymentInput'
      responses:
        '201':
          description: Payment record appended
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SubscriptionPayment'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /platform/geo/countries:
    get:
      tags:
        - Platform - Geo
      summary: List countries
      description: Platform administrator only. Supports pagination and search by English name, Arabic name, or code.
      security:
        - platformBearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: search
          in: query
          description: Case-insensitive search across English name, Arabic name, and code.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Paginated countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GeoEntry'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Platform - Geo
      summary: Create country
      security:
        - platformBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryInput'
      responses:
        '201':
          description: Country created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GeoEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /platform/geo/countries/{countryId}:
    parameters:
      - name: countryId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Platform - Geo
      summary: Get country by ID
      security:
        - platformBearerAuth: []
      responses:
        '200':
          description: Country details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GeoEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Platform - Geo
      summary: Update country
      security:
        - platformBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountryUpdate'
      responses:
        '200':
          description: Country updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GeoEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Platform - Geo
      summary: Delete country
      security:
        - platformBearerAuth: []
      responses:
        '200':
          description: Country deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Geo entry deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/geo/governorates:
    get:
      tags:
        - Platform - Geo
      summary: List governorates
      description: Platform administrator only. Supports pagination, search by English name, Arabic name, or code, and filtering by country_id.
      security:
        - platformBearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: search
          in: query
          description: Case-insensitive search across English name, Arabic name, and code.
          schema:
            type: string
            maxLength: 100
        - name: country_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated governorates
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GeoEntry'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Platform - Geo
      summary: Create governorate
      security:
        - platformBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernorateInput'
      responses:
        '201':
          description: Governorate created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GeoEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /platform/geo/governorates/{governorateId}:
    parameters:
      - name: governorateId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Platform - Geo
      summary: Get governorate by ID
      security:
        - platformBearerAuth: []
      responses:
        '200':
          description: Governorate details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GeoEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Platform - Geo
      summary: Update governorate
      security:
        - platformBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernorateUpdate'
      responses:
        '200':
          description: Governorate updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GeoEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Platform - Geo
      summary: Delete governorate
      security:
        - platformBearerAuth: []
      responses:
        '200':
          description: Governorate deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Geo entry deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/geo/cities:
    get:
      tags:
        - Platform - Geo
      summary: List cities
      description: Platform administrator only. Supports pagination, search by English name, Arabic name, or code, and filtering by governorate_id.
      security:
        - platformBearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: search
          in: query
          description: Case-insensitive search across English name, Arabic name, and code.
          schema:
            type: string
            maxLength: 100
        - name: governorate_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated cities
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GeoEntry'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Platform - Geo
      summary: Create city
      security:
        - platformBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityInput'
      responses:
        '201':
          description: City created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GeoEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /platform/geo/cities/{cityId}:
    parameters:
      - name: cityId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Platform - Geo
      summary: Get city by ID
      security:
        - platformBearerAuth: []
      responses:
        '200':
          description: City details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GeoEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Platform - Geo
      summary: Update city
      security:
        - platformBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityUpdate'
      responses:
        '200':
          description: City updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/GeoEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Platform - Geo
      summary: Delete city
      security:
        - platformBearerAuth: []
      responses:
        '200':
          description: City deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Geo entry deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/geo/districts:
    get:
      tags:
        - Platform - Geo
      summary: List districts
      description: Platform administrator only. Supports pagination, search by English name, Arabic name, or code, and filtering by city_id.
      security:
        - platformBearerAuth: []
      parameters:
        - name: page
