openapi: 3.0.3
components:
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    Search:
      name: search
      in: query
      description: Case-insensitive match against English name, Arabic name, or code.
      schema: { type: string, maxLength: 100 }
  schemas:
    GeoListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name_en: { type: string }
              name_ar: { type: string, nullable: true }
              code: { type: string, nullable: true }
              country: { $ref: '#/components/schemas/TenantGeoParent' }
              governorate: { $ref: '#/components/schemas/TenantGeoParent' }
              city: { $ref: '#/components/schemas/TenantGeoParent' }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
    TenantGeoParent:
      type: object
      nullable: true
      properties:
        id: { type: string }
        name_en: { type: string }
        name_ar: { type: string, nullable: true }
        code: { type: string, nullable: true }
        country: { $ref: '#/components/schemas/TenantGeoParent' }
        governorate: { $ref: '#/components/schemas/TenantGeoParent' }
