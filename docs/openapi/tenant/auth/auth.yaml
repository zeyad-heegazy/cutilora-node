openapi: 3.0.3
paths:
  /auth/login:
    post:
      tags: [Authentication]
      x-apidog-folder: "Tenant/Auth"
      summary: Log in
      description: Returns an access token and the user's active tenant memberships.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  { type: string, format: email, example: admin@example.com }
                password:
                  { type: string, format: password, example: "your-password" }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                      token_type: { type: string, example: Bearer }
                      user: { $ref: "../../../openapi.yaml#/components/schemas/UserSummary" }
                      memberships:
                        type: array
                        items:
                          { $ref: "../../../openapi.yaml#/components/schemas/MembershipSummary" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
  /auth/invitations/accept:
    post:
      tags: [Authentication]
      x-apidog-folder: "Tenant/Auth"
      summary: Accept a tenant invitation
      description: Uses the single-use invitation token as proof of invitation. Existing active user accounts are linked by the invited email. New users must provide a name and password. The invitation token must be delivered privately by the tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32 }
                name: { type: string, minLength: 2, maxLength: 120, description: Required when the email has no existing user account }
                password: { type: string, format: password, minLength: 12, maxLength: 128, description: Required when the email has no existing user account }
      responses:
        "200": { description: Invitation accepted and tenant membership activated }
        "400": { description: Invalid, expired, or already-used invitation token }
        "409": { description: Membership or invitation state conflict }
        "422": { description: Account details required for a new user }
  /auth/logout:
    post:
      tags: [Authentication]
      x-apidog-folder: "Tenant/Auth"
      summary: Log out current user
      description: Revokes the current regular-user access token. Other sessions remain active.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Logged out successfully. }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
  /auth/me:
    get:
      tags: [Authentication]
      x-apidog-folder: "Tenant/Auth"
      summary: Get current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user and active memberships
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user:
                        {
                          type: object,
                          description: User record (password hash is not exposed),
                        }
                      memberships: { type: array, items: { type: object } }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
