paths:
  /tenant/profile:
    get:
      tags: [Tenant Organization]
      summary: Get organization profile
      description: Returns the authenticated user's active tenant profile. Requires tenant-wide owner or admin access.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/Tenant" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
    patch:
      tags: [Tenant Organization]
      summary: Update organization profile
      description: Updates tenant identity, contact, address, legal details, branding and preferences. Only the Tenant Owner may change legal identity fields. Logo and cover images are sent as Base64 data URLs and stored as files; the API persists their public URLs.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../../openapi.yaml#/components/schemas/TenantUpdate" }
      responses:
        "200":
          description: Updated tenant profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/Tenant" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/ValidationError" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
  /tenant/preferences:
    get:
      tags: [Tenant Organization]
      summary: Get organization preferences
      description: Returns organization-level defaults, including defaults applied when the tenant is created without explicit preferences.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      responses:
        "200":
          description: Organization preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/TenantPreferences" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
    patch:
      tags: [Tenant Organization]
      summary: Update organization preferences
      description: Updates organization-level defaults using a partial merge. Unspecified preference values are preserved. Clinic and branch timezones remain independent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences: { $ref: "../../../openapi.yaml#/components/schemas/TenantPreferences" }
      responses:
        "200":
          description: Updated organization preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/TenantPreferences" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/ValidationError" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
