paths:
  /tenant/configuration:
    get:
      tags: [Tenant Configuration]
      x-apidog-folder: "Tenant/Shared Configuration"
      summary: Get organization defaults
      description: Returns versioned tenant defaults and change history. These values are inherited by newly created clinics; existing clinics retain their own overrides until explicitly published.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      responses:
        "200": { description: Versioned tenant configuration }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
    patch:
      tags: [Tenant Configuration]
      x-apidog-folder: "Tenant/Shared Configuration"
      summary: Update organization defaults
      description: Updates tenant-level defaults and increments the configuration version. Does not silently overwrite existing clinic settings.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            example: { values: { locale: "en", currency: "EGP", timezone: "Africa/Cairo" } }
            schema:
              type: object
              required: [values]
              properties:
                values: { type: object, additionalProperties: true }
      responses:
        "200": { description: Updated configuration and version history }
        "400": { $ref: "../../../openapi.yaml#/components/responses/ValidationError" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "409": { description: Configuration changed concurrently; reload and retry }
  /tenant/configuration/preview-apply:
    post:
      tags: [Tenant Configuration]
      x-apidog-folder: "Tenant/Shared Configuration"
      summary: Preview publishing defaults to clinics
      description: Shows the target clinics, current configuration version, clinic overrides and effective values without changing data.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            example: { applyTo: all }
            schema:
              type: object
              required: [applyTo]
              properties:
                applyTo: { type: string, enum: [all, selected] }
                clinicIds: { type: array, items: { type: string }, uniqueItems: true, maxItems: 100 }
      responses:
        "200": { description: Configuration impact preview }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { description: A selected clinic does not belong to this tenant }
  /tenant/configuration/apply:
    post:
      tags: [Tenant Configuration]
      x-apidog-folder: "Tenant/Shared Configuration"
      summary: Publish defaults to clinics
      description: Requires confirm=true after preview. Applies only the organizationDefaults/version fields, preserves clinic-specific overrides and is safe to retry for the same version.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            example: { applyTo: all, confirm: true }
            schema:
              type: object
              required: [applyTo, confirm]
              properties:
                applyTo: { type: string, enum: [all, selected] }
                clinicIds: { type: array, items: { type: string }, uniqueItems: true, maxItems: 100 }
                confirm: { type: boolean, enum: [true] }
      responses:
        "200": { description: Number of clinics updated and skipped }
        "400": { $ref: "../../../openapi.yaml#/components/responses/ValidationError" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { description: A selected clinic does not belong to this tenant }

  /tenant/catalog-templates:
    get:
      tags: [Tenant Configuration]
      summary: List shared catalog and policy templates
      description: Lists tenant-owned service/treatment, pricing, appointment, cancellation, rescheduling, message, notification and operational policy templates.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: type, in: query, schema: { type: string, enum: [service_treatment, pricing, appointment_policy, cancellation_policy, rescheduling_policy, message_template, notification_template, operational_policy] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, published, archived] } }
      responses:
        "200": { description: Tenant templates }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Tenant Configuration]
      summary: Create a shared catalog or policy template
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            example: { name: "Laser Hair Removal", key: "laser-hair-removal", type: service_treatment, description: "Laser hair removal service template", content: { durationMinutes: 30, category: laser } }
            schema:
              type: object
              required: [name, key, type, content]
              properties:
                name: { type: string, maxLength: 120 }
                key: { type: string, maxLength: 140 }
                type: { type: string, enum: [service_treatment, pricing, appointment_policy, cancellation_policy, rescheduling_policy, message_template, notification_template, operational_policy] }
                description: { type: string, maxLength: 1000 }
                content: { type: object, additionalProperties: true }
      responses:
        "201": { description: Draft template created }
        "409": { description: Template key already exists }
  /tenant/catalog-templates/{templateId}:
    parameters:
      - { name: templateId, in: path, required: true, schema: { type: string } }
      - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
    get:
      tags: [Tenant Configuration]
      summary: Get a tenant template
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Template details and version history }
        "404": { description: Template not found in this tenant }
    patch:
      tags: [Tenant Configuration]
      summary: Update a draft or published template
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example: { expectedVersion: 1, name: "Laser Hair Removal - Updated", description: "Updated service template" }
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                name: { type: string }
                key: { type: string }
                type: { type: string, enum: [service_treatment, pricing, appointment_policy, cancellation_policy, rescheduling_policy, message_template, notification_template, operational_policy] }
                description: { type: string }
                content: { type: object, additionalProperties: true }
      responses:
        "200": { description: Updated template }
        "409": { description: Optimistic version conflict or archived template }
  /tenant/catalog-templates/{templateId}/archive:
    post:
      tags: [Tenant Configuration]
      summary: Archive a template
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: templateId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            example: { expectedVersion: 2 }
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200": { description: Archived template }
        "409": { description: Version conflict }
  /tenant/catalog-templates/{templateId}/publish:
    post:
      tags: [Tenant Configuration]
      summary: Publish a template and optionally apply it to clinics
      description: Requires explicit confirmation. Selected clinic IDs are validated against the authenticated tenant. Applying a template writes a versioned organization template snapshot and does not overwrite clinic preferences or other template keys.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: templateId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            example: { expectedVersion: 2, applyTo: none, confirm: true }
            schema:
              type: object
              required: [expectedVersion, applyTo, confirm]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                applyTo: { type: string, enum: [none, all, selected] }
                clinicIds: { type: array, maxItems: 100, uniqueItems: true, items: { type: string } }
                confirm: { type: boolean, enum: [true] }
      responses:
        "200": { description: Published template and per-clinic applied/skipped counts }
        "404": { description: Template or selected clinic not found }
        "409": { description: Version conflict or archived template }

  /tenant/catalog-templates/{templateId}/rollback:
    post:
      tags: [Tenant Configuration]
      summary: Restore a retained template version
      description: Restores a retained content snapshot as a new draft version. Existing clinic snapshots are not silently changed; republish after reviewing the restored draft.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: templateId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            example: { expectedVersion: 3, targetVersion: 1 }
            schema:
              type: object
              required: [expectedVersion, targetVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                targetVersion: { type: integer, minimum: 1 }
      responses:
        "200": { description: Restored content as a new draft version }
        "404": { description: Template or retained version not found }
        "409": { description: Version conflict or archived template }
