openapi: 3.0.3
paths:
  /tenant/clinics:
    get:
      tags: [Clinics]
      summary: List clinics in current tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicId"
        - $ref: "../../../openapi.yaml#/components/parameters/BranchId"
      responses:
        "200":
          description: Clinic list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: "../../../openapi.yaml#/components/schemas/Clinic" } }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Clinics]
      summary: Create clinic
      description: Creates a clinic inside the active tenant. Slug is generated by the server.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../../openapi.yaml#/components/schemas/ClinicInput" }
      responses:
        "201":
          description: Clinic created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/Clinic" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "422": { $ref: "../../../openapi.yaml#/components/responses/ValidationError" }
        "422": { $ref: "../../../openapi.yaml#/components/responses/ValidationError" }
  /tenant/clinics/{clinicId}:
    get:
      tags: [Clinics]
      summary: Get clinic details
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: clinicId, in: path, required: true, schema: { type: string } }
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      responses:
        "200":
          description: Clinic details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/Clinic" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
    patch:
      tags: [Clinics]
      summary: Partially update clinic
      description: Updates only supplied fields. Changing name regenerates the server-controlled slug. Location hierarchy is validated using existing values plus the supplied changes.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: clinicId, in: path, required: true, schema: { type: string } }
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../../openapi.yaml#/components/schemas/ClinicUpdate" }
      responses:
        "200":
          description: Clinic updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/Clinic" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
