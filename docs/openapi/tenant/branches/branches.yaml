openapi: 3.0.3
paths:
  /tenant/branches:
    get:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: List branches in current clinic
      description: "X-Clinic-Id is required. Results are restricted to X-Branch-Id when supplied. Branch-scoped memberships must select an authorized branch. Lifecycle values: draft, active, temporarily_closed, suspended, closed."
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - $ref: "../../../openapi.yaml#/components/parameters/BranchId"
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [draft, active, temporarily_closed, suspended, closed] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Branch list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "../../../openapi.yaml#/components/schemas/Branch" }
                  pagination: { type: object, additionalProperties: true }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: Create branch in current clinic
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
                status: { type: string, enum: [draft, active], default: active, description: Create as draft to complete branch details before activation; omitted preserves the existing active-by-default behavior. }
                slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", description: Optional; generated from name when omitted }
                code: { type: string, maxLength: 30 }
                address: { type: string, maxLength: 500 }
                addressDetails: { type: object, additionalProperties: true }
                contact: { type: object, additionalProperties: true }
                contactPerson: { type: object, additionalProperties: true }
                cityId: { type: string, nullable: true }
                postalCode: { type: string, maxLength: 30 }
                latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
                longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
                settings: { type: object, additionalProperties: true }
                openingDate: { type: string, format: date-time, nullable: true }
                timezone: { type: string, description: Valid IANA timezone; defaults to clinic timezone }
                operatingHours:
                  type: array
                  maxItems: 7
                  items: { $ref: "../../../openapi.yaml#/components/schemas/OperatingHoursDay" }
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/Branch" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../../openapi.yaml#/components/responses/Conflict" }
  /tenant/branches/{branchId}:
    get:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: Get a branch
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - $ref: "../../../openapi.yaml#/components/parameters/BranchId"
        - name: branchId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Branch details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/Branch" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
    patch:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: Update branch details and operating hours; tenant admins and clinic admins or managers can also change lifecycle status
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - $ref: "../../../openapi.yaml#/components/parameters/BranchId"
        - name: branchId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../../openapi.yaml#/components/schemas/BranchUpdate" }
      responses:
        "200":
          description: Branch updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/Branch" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../../openapi.yaml#/components/responses/Conflict" }

  /tenant/branches/{branchId}/business-hours:
    get:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: Get branch business hours
      description: Returns the branch timezone and weekly operating schedule. Branch-scoped users can only read their selected branch.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - name: branchId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Branch business hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      timezone: { type: string }
                      operatingHours:
                        type: array
                        items: { $ref: "../../../openapi.yaml#/components/schemas/OperatingHoursDay" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
    put:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: Replace branch weekly business hours
      description: Replaces the complete weekly schedule. Exactly seven entries are required, one for every weekday (0-6); mark closed days with isClosed=true. Open days require either one legacy open/close window or one to three non-overlapping split shifts; breaks must be contained within their shift. Overnight hours are not supported. Requires branch.schedule.manage permission.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - name: branchId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operatingHours]
              properties:
                operatingHours:
                  type: array
                  maxItems: 7
                  items: { $ref: "../../../openapi.yaml#/components/schemas/OperatingHoursDay" }
      responses:
        "200":
          description: Updated branch business hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      timezone: { type: string }
                      operatingHours:
                        type: array
                        items: { $ref: "../../../openapi.yaml#/components/schemas/OperatingHoursDay" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }



  /tenant/branches/{branchId}/activity:
    get:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: List branch activity
      description: Returns audit events for this branch only. Branch-scoped users can view only their own branch. Requires branch.activity.read.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - name: branchId
          in: path
          required: true
          schema: { type: string }
        - { name: actorId, in: query, schema: { type: string, pattern: "^[a-f0-9]{24}$" } }
        - { name: action, in: query, schema: { type: string, maxLength: 120 } }
        - { name: targetType, in: query, schema: { type: string, maxLength: 80 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Branch activity events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { type: object, additionalProperties: true } }
                  pagination: { type: object, additionalProperties: true }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }

  /tenant/branches/{branchId}/users:
    get:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: List users assigned to a branch
      description: Returns clinic-scoped members and branch-scoped members assigned to this branch. Branch-scoped users can only list users for their own branch. Requires branch.members.read.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - name: branchId
          in: path
          required: true
          schema: { type: string }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, invited, suspended] } }
        - { name: role, in: query, schema: { type: string, enum: [tenant_owner, tenant_admin, billing_admin, clinic_admin, clinic_manager, branch_manager, staff, provider, receptionist] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Assigned users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { type: object, additionalProperties: true } }
                  pagination: { type: object, additionalProperties: true }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
