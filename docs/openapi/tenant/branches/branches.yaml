openapi: 3.0.3
paths:
  /tenant/branches:
    get:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: List branches in current clinic
      description: X-Clinic-Id is required. Results are restricted to X-Branch-Id when supplied. Branch-scoped memberships must select an authorized branch.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - $ref: "../../../openapi.yaml#/components/parameters/BranchId"
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Branch list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "../../../openapi.yaml#/components/schemas/Branch" }
                  pagination: { type: object, additionalProperties: true }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: Create branch in current clinic
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
                slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", description: Optional; generated from name when omitted }
                code: { type: string, maxLength: 30 }
                address: { type: string, maxLength: 500 }
                addressDetails: { type: object, additionalProperties: true }
                contact: { type: object, additionalProperties: true }
                contactPerson: { type: object, additionalProperties: true }
                cityId: { type: string, nullable: true }
                postalCode: { type: string, maxLength: 30 }
                latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
                longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
                settings: { type: object, additionalProperties: true }
                openingDate: { type: string, format: date-time, nullable: true }
                timezone: { type: string, description: Valid IANA timezone; defaults to clinic timezone }
                operatingHours:
                  type: array
                  maxItems: 7
                  items: { $ref: "../../../openapi.yaml#/components/schemas/OperatingHoursDay" }
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/Branch" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../../openapi.yaml#/components/responses/Conflict" }
  /tenant/branches/{branchId}:
    get:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: Get a branch
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - $ref: "../../../openapi.yaml#/components/parameters/BranchId"
        - name: branchId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Branch details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/Branch" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
    patch:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: Update branch details and operating hours; tenant admins and clinic admins or managers can also change lifecycle status
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - $ref: "../../../openapi.yaml#/components/parameters/BranchId"
        - name: branchId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../../openapi.yaml#/components/schemas/BranchUpdate" }
      responses:
        "200":
          description: Branch updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../openapi.yaml#/components/schemas/Branch" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../../openapi.yaml#/components/responses/Conflict" }

  /tenant/branches/{branchId}/business-hours:
    get:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: Get branch business hours
      description: Returns the branch timezone and weekly operating schedule. Branch-scoped users can only read their selected branch.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - name: branchId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Branch business hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      timezone: { type: string }
                      operatingHours:
                        type: array
                        items: { $ref: "../../../openapi.yaml#/components/schemas/OperatingHoursDay" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
    put:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches"
      summary: Replace branch weekly business hours
      description: Replaces the complete weekly schedule. Each weekday may appear once; open days require valid open/close times and non-overlapping breaks. Overnight hours are not supported. Requires branch.update permission.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - name: branchId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operatingHours]
              properties:
                operatingHours:
                  type: array
                  maxItems: 7
                  items: { $ref: "../../../openapi.yaml#/components/schemas/OperatingHoursDay" }
      responses:
        "200":
          description: Updated branch business hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      timezone: { type: string }
                      operatingHours:
                        type: array
                        items: { $ref: "../../../openapi.yaml#/components/schemas/OperatingHoursDay" }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
