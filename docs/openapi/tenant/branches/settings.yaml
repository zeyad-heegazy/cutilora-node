paths:
  /tenant/branches/{branchId}/settings:
    get:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches/Settings"
      summary: Get branch settings
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - { name: branchId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Inherited clinic values, branch overrides, effective values, timezone and operating hours }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
    patch:
      tags: [Branches]
      x-apidog-folder: "Tenant/Branches/Settings"
      summary: Update branch-specific overrides
      description: Merges supplied branch settings without changing organization defaults or clinic settings. Requires branch.settings.manage permission.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - { name: branchId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            example: { overrides: { appointmentBufferMinutes: 10, allowWalkIns: true } }
            schema:
              type: object
              required: [overrides]
              properties:
                overrides: { type: object, minProperties: 1, additionalProperties: true }
      responses:
        "200": { description: Updated effective branch configuration and source labels }
        "400": { $ref: "../../../openapi.yaml#/components/responses/ValidationError" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
