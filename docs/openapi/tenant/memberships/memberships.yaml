paths:
  /tenant/roles:
    get:
      tags: [Tenant Access Control]
      x-apidog-folder: "Tenant/Access Control"
      summary: List built-in and tenant custom roles
      description: Returns built-in role templates and tenant-owned custom roles. Custom roles are scoped, versioned and permission-validated.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: scope, in: query, schema: { type: string, enum: [tenant, clinic, branch] } }
      responses:
        "200": { description: Built-in role templates and tenant custom roles }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Tenant Access Control]
      x-apidog-folder: "Tenant/Access Control"
      summary: Create a tenant custom role
      description: Tenant Owner can create roles at any scope. Tenant Admin can create clinic or branch roles only and cannot grant permissions they do not possess.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope, permissions]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                scope: { type: string, enum: [tenant, clinic, branch] }
                permissions: { type: array, uniqueItems: true, items: { type: string } }
      responses:
        "201": { description: Custom role created }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../../../openapi.yaml#/components/responses/Conflict" }
  /tenant/roles/{roleId}:
    get:
      tags: [Tenant Access Control]
      x-apidog-folder: "Tenant/Access Control"
      summary: Get a tenant custom role and its version history
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: roleId, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      responses:
        "200": { description: Custom role with immutable version history and assignment count }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
    patch:
      tags: [Tenant Access Control]
      x-apidog-folder: "Tenant/Access Control"
      summary: Update a tenant custom role
      description: Requires the current role version. Existing assignments receive the updated permission set immediately; the change is audit logged.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: roleId, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                name: { type: string, minLength: 2, maxLength: 80 }
                description: { type: string, maxLength: 500 }
                permissions: { type: array, uniqueItems: true, items: { type: string } }
      responses:
        "200": { description: Custom role updated }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../../openapi.yaml#/components/responses/Conflict" }
  /tenant/roles/{roleId}/permissions:
    put:
      tags: [Tenant Access Control]
      x-apidog-folder: "Tenant/Access Control"
      summary: Replace a custom role permission set
      description: Requires optimistic version and records the permission snapshot in role history.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: roleId, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, permissions]
              properties:
                version: { type: integer, minimum: 1 }
                permissions: { type: array, uniqueItems: true, items: { type: string } }
      responses:
        "200": { description: Permission set replaced }
        "409": { $ref: "../../../openapi.yaml#/components/responses/Conflict" }
  /tenant/roles/{roleId}/clone:
    post:
      tags: [Tenant Access Control]
      x-apidog-folder: "Tenant/Access Control"
      summary: Clone an existing custom role
      description: Creates a new custom role with the source scope and permissions. The actor must be authorized to grant every copied permission.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: roleId, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                description: { type: string, maxLength: 500 }
      responses:
        "201": { description: Cloned custom role created }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
  /tenant/roles/{roleId}/archive:
    post:
      tags: [Tenant Access Control]
      x-apidog-folder: "Tenant/Access Control"
      summary: Archive an unused custom role
      description: Roles with active or suspended membership assignments cannot be archived. Reassign memberships first.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: roleId, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      responses:
        "200": { description: Custom role archived }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../../openapi.yaml#/components/responses/Conflict" }
  /tenant/permissions/catalog:
    get:
      tags: [Tenant Access Control]
      x-apidog-folder: "Tenant/Access Control"
      summary: List assignable tenant permissions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      responses:
        "200": { description: Canonical tenant permission catalog }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
  /tenant/access/me:
    get:
      tags: [Tenant Access Control]
      x-apidog-folder: "Tenant/Access Control"
      summary: Get current user's effective tenant access
      description: Returns active-context permissions and grant origins. Tenant grants inherit into clinic and branch contexts; clinic grants inherit into branches; direct membership grants and denials are distinguished.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      responses:
        "200": { description: Effective access for the authenticated membership and selected context }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
  /tenant/users/{userId}/effective-access:
    get:
      tags: [Tenant Memberships]
      x-apidog-folder: "Tenant/Users and Memberships"
      summary: Preview a tenant user's effective access
      description: Returns only memberships in the active tenant, their clinic/branch scopes and effective permissions derived from built-in or assigned custom roles. Suspended memberships return no effective permissions.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: userId, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      responses:
        "200": { description: Tenant-scoped effective access preview }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
  /tenant/users/{userId}:
    get:
      tags: [Tenant Organization]
      summary: Get tenant user details and memberships
      description: Returns global identity details and memberships belonging only to the active tenant. Session data is not included.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Tenant user details and tenant-scoped memberships }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
  /tenant/users:
    get:
      tags: [Tenant Memberships]
      x-apidog-folder: "Tenant/Users and Memberships"
      summary: List tenant users and memberships
      description: Lists tenant memberships with linked user identity, clinic/branch scopes and lastLoginAt.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, invited, suspended] } }
        - { name: role, in: query, schema: { type: string, enum: [tenant_owner, tenant_admin, billing_admin, clinic_admin, clinic_manager, branch_manager, staff, provider, receptionist, custom] } }
        - { name: scope, in: query, schema: { type: string, enum: [tenant, clinic, branch] } }
        - { name: clinicId, in: query, schema: { type: string } }
        - { name: lastLoginFrom, in: query, schema: { type: string, format: date-time } }
        - { name: lastLoginTo, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: Paginated tenant memberships and scoped user identities }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
  /tenant/invitations:
    get:
      tags: [Tenant Memberships]
      x-apidog-folder: "Tenant/Users and Memberships"
      summary: List tenant invitations
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, processing, expired, accepted, revoked] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: Paginated tenant invitations without token hashes }
    post:
      tags: [Tenant Memberships]
      x-apidog-folder: "Tenant/Users and Memberships"
      summary: Create a tenant invitation
      description: Returns a single-use invitation token for private delivery. Email delivery is not configured by this endpoint.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role, scope]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [tenant_admin, billing_admin, clinic_admin, clinic_manager, branch_manager, staff, provider, receptionist] }
                scope: { type: string, enum: [tenant, clinic, branch] }
                clinicId: { type: string }
                branchIds: { type: array, items: { type: string } }
                expiresInDays: { type: integer, minimum: 1, maximum: 30, default: 7 }
      responses:
        "201": { description: Invitation created; token returned once for private delivery }
        "400": { $ref: "../../../openapi.yaml#/components/responses/ValidationError" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "409": { description: A pending invitation already exists for this email }
  /tenant/invitations/{invitationId}/revoke:
    post:
      tags: [Tenant Memberships]
      x-apidog-folder: "Tenant/Users and Memberships"
      summary: Revoke a pending invitation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: invitationId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Invitation revoked }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
  /tenant/invitations/{invitationId}/resend:
    post:
      tags: [Tenant Memberships]
      x-apidog-folder: "Tenant/Users and Memberships"
      summary: Resend an invitation by rotating its token
      description: Returns a new token for private delivery. The previous token becomes invalid.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: invitationId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: New single-use token returned }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
  /tenant/memberships/{membershipId}/history:
    get:
      tags: [Tenant Organization]
      summary: List tenant membership history
      description: Returns append-only tenant audit events associated with a membership. Membership ownership is checked before history is returned.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: membershipId, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: Membership audit history }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
  /tenant/memberships/{membershipId}:
    patch:
      tags: [Tenant Memberships]
      x-apidog-folder: "Tenant/Users and Memberships"
      summary: Update tenant membership role, scope or status
      description: Enforces role-to-scope compatibility, validates clinic/branch ownership, prevents self-modification and protects the last active Tenant Owner.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - { name: membershipId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [tenant_owner, tenant_admin, billing_admin, clinic_admin, clinic_manager, branch_manager, staff, provider, receptionist, custom] }
                customRoleId: { type: string, nullable: true }
                permissionOverrides:
                  type: object
                  properties:
                    allow: { type: array, items: { type: string } }
                    deny: { type: array, items: { type: string } }
                scope: { type: string, enum: [tenant, clinic, branch] }
                clinicId: { type: string, nullable: true }
                branchIds: { type: array, items: { type: string }, maxItems: 50 }
                status: { type: string, enum: [active, suspended] }
      responses:
        "200": { description: Membership updated }
        "400": { $ref: "../../../openapi.yaml#/components/responses/ValidationError" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
        "409": { description: Last active Tenant Owner cannot be demoted or suspended }
