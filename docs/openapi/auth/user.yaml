openapi: 3.0.3
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      description: Returns an access token and the user's active tenant memberships.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  { type: string, format: email, example: admin@example.com }
                password:
                  { type: string, format: password, example: "your-password" }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                      token_type: { type: string, example: Bearer }
                      user: { $ref: "../openapi.yaml#/components/schemas/UserSummary" }
                      memberships:
                        type: array
                        items:
                          { $ref: "../openapi.yaml#/components/schemas/MembershipSummary" }
        "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
        "422": { $ref: "../openapi.yaml#/components/responses/ValidationError" }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user and active memberships
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user:
                        {
                          type: object,
                          description: User record (password hash is not exposed),
                        }
                      memberships: { type: array, items: { type: object } }
        "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
