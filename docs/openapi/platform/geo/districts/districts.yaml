openapi: 3.0.3
paths:
  /platform/geo/districts:
    get:
      tags: [Portal Platform]
      x-apidog-folder: "Platform/Geo/Districts"
      summary: List districts
      description: Platform administrator only. Supports pagination, search by English name, Arabic name, or code, and filtering by city_id.
      security: [{ platformBearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
        - name: search
          in: query
          description: Case-insensitive search across English name, Arabic name, and code.
          schema: { type: string, maxLength: 100 }
        - name: city_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated districts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    {
                      type: array,
                      items: { $ref: "../../../../openapi.yaml#/components/schemas/GeoEntry" },
                    }
                  meta: { $ref: "../../../../openapi.yaml#/components/schemas/Pagination" }
        "401": { $ref: "../../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Portal Platform]
      x-apidog-folder: "Platform/Geo/Districts"
      summary: Create district
      security: [{ platformBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../../../openapi.yaml#/components/schemas/DistrictInput" }
      responses:
        "201":
          description: District created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../../openapi.yaml#/components/schemas/GeoEntry" }
        "401": { $ref: "../../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../../openapi.yaml#/components/responses/Forbidden" }
        "422": { $ref: "../../../../openapi.yaml#/components/responses/ValidationError" }
  /platform/geo/districts/{districtId}:
    parameters:
      - name: districtId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Portal Platform]
      x-apidog-folder: "Platform/Geo/Districts"
      summary: Get district by ID
      security: [{ platformBearerAuth: [] }]
      responses:
        "200":
          description: District details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../../openapi.yaml#/components/schemas/GeoEntry" }
        "401": { $ref: "../../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../../openapi.yaml#/components/responses/NotFound" }
    patch:
      tags: [Portal Platform]
      x-apidog-folder: "Platform/Geo/Districts"
      summary: Update district
      security: [{ platformBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../../../openapi.yaml#/components/schemas/DistrictUpdate" }
      responses:
        "200":
          description: District updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../../openapi.yaml#/components/schemas/GeoEntry" }
        "401": { $ref: "../../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../../openapi.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../../../openapi.yaml#/components/responses/ValidationError" }
    delete:
      tags: [Portal Platform]
      x-apidog-folder: "Platform/Geo/Districts"
      summary: Delete district
      security: [{ platformBearerAuth: [] }]
      responses:
        "200":
          description: District deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string, example: Geo entry deleted. }
        "401": { $ref: "../../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../../openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../../../openapi.yaml#/components/responses/Conflict" }
