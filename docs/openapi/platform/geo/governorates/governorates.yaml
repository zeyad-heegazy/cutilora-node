openapi: 3.0.3
paths:
  /platform/geo/governorates:
    get:
      tags: [Portal Platform]
      x-apidog-folder: "Platform/Geo/Governorates"
      summary: List governorates
      description: Platform administrator only. Supports pagination, search by English name, Arabic name, or code, and filtering by country_id.
      security: [{ platformBearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
        - name: search
          in: query
          description: Case-insensitive search across English name, Arabic name, and code.
          schema: { type: string, maxLength: 100 }
        - name: country_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated governorates
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    {
                      type: array,
                      items: { $ref: "../../../../openapi.yaml#/components/schemas/GeoEntry" },
                    }
                  meta: { $ref: "../../../../openapi.yaml#/components/schemas/Pagination" }
        "401": { $ref: "../../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Portal Platform]
      x-apidog-folder: "Platform/Geo/Governorates"
      summary: Create governorate
      security: [{ platformBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example: { name_en: "Giza", name_ar: "الجيزة", country_id: "64b000000000000000000001" }
            schema: { $ref: "../../../../openapi.yaml#/components/schemas/GovernorateInput" }
      responses:
        "201":
          description: Governorate created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../../openapi.yaml#/components/schemas/GeoEntry" }
        "401": { $ref: "../../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../../openapi.yaml#/components/responses/Forbidden" }
        "422": { $ref: "../../../../openapi.yaml#/components/responses/ValidationError" }
  /platform/geo/governorates/{governorateId}:
    parameters:
      - name: governorateId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Portal Platform]
      x-apidog-folder: "Platform/Geo/Governorates"
      summary: Get governorate by ID
      security: [{ platformBearerAuth: [] }]
      responses:
        "200":
          description: Governorate details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../../openapi.yaml#/components/schemas/GeoEntry" }
        "401": { $ref: "../../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../../openapi.yaml#/components/responses/NotFound" }
    patch:
      tags: [Portal Platform]
      x-apidog-folder: "Platform/Geo/Governorates"
      summary: Update governorate
      security: [{ platformBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example: { name_en: "Giza Governorate", name_ar: "الجيزة", country_id: "64b000000000000000000001" }
            schema: { $ref: "../../../../openapi.yaml#/components/schemas/GovernorateUpdate" }
      responses:
        "200":
          description: Governorate updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../../openapi.yaml#/components/schemas/GeoEntry" }
        "401": { $ref: "../../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../../openapi.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../../../openapi.yaml#/components/responses/ValidationError" }
    delete:
      tags: [Portal Platform]
      x-apidog-folder: "Platform/Geo/Governorates"
      summary: Delete governorate
      security: [{ platformBearerAuth: [] }]
      responses:
        "200":
          description: Governorate deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string, example: Geo entry deleted. }
        "401": { $ref: "../../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../../openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../../../openapi.yaml#/components/responses/Conflict" }
