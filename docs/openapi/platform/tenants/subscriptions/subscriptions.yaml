openapi: 3.0.3
paths:
  /platform/tenants/{tenantId}/subscription:
    put:
      tags: [Portal Platform]
      x-apidog-folder: "Platform/Subscriptions"
      summary: Create or replace tenant subscription
      description: Stores the commercial subscription snapshot. No payment gateway is charged by this endpoint.
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            example: { plan: { code: "growth", name: "Growth", amount: 2500, currency: EGP, limits: { maxClinics: 3, maxBranches: 10, maxUsers: 50 }, features: ["appointments", "patients", "finance"] }, billingCycle: monthly, status: active, cancelAtPeriodEnd: false }
            schema: { $ref: "../../../../openapi.yaml#/components/schemas/SubscriptionInput" }
      responses:
        "200":
          description: Subscription saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../../../openapi.yaml#/components/schemas/Subscription" }
        "404": { $ref: "../../../../openapi.yaml#/components/responses/NotFound" }
        "400": { $ref: "../../../../openapi.yaml#/components/responses/BadRequest" }
        "422": { $ref: "../../../../openapi.yaml#/components/responses/ValidationError" }
