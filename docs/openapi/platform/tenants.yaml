openapi: 3.0.3
paths:
  /platform/tenants:
    get:
      tags: [Platform - Tenants]
      summary: List tenants
      security: [{ platformBearerAuth: [] }]
      responses:
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: "../../openapi.yaml#/components/schemas/Tenant" } }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Platform - Tenants]
      summary: Create tenant and owner
      description: Tenant and optional first clinic are created together. Slugs are generated by the server. Subscription is managed separately after tenant creation.
      security: [{ platformBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, owner]
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
                displayName: { type: string, maxLength: 160 }
                legalName: { type: string, maxLength: 200 }
                businessType: { type: string, enum: [single_clinic, clinic_group, medical_center], default: single_clinic }
                description: { type: string, maxLength: 2000 }
                industry: { type: string, example: aesthetic_medicine }
                contact: { $ref: "../../openapi.yaml#/components/schemas/BusinessContact" }
                address: { $ref: "../../openapi.yaml#/components/schemas/BusinessAddress" }
                legal: { $ref: "../../openapi.yaml#/components/schemas/TenantLegal" }
                branding: { $ref: "../../openapi.yaml#/components/schemas/Branding" }
                preferences: { $ref: "../../openapi.yaml#/components/schemas/TenantPreferences" }
                settings: { type: object, additionalProperties: true }
                owner:
                  type: object
                  required: [name, email, password]
                  properties:
                    name: { type: string, minLength: 2 }
                    email: { type: string, format: email }
                    password: { type: string, format: password, minLength: 12 }
                initialClinic:
                  allOf:
                    - { $ref: "../../openapi.yaml#/components/schemas/ClinicInput" }
                  description: Optional first clinic; its slug is generated by the server.
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../openapi.yaml#/components/schemas/TenantDetails" }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../../openapi.yaml#/components/responses/Conflict" }
        "422": { $ref: "../../openapi.yaml#/components/responses/ValidationError" }
  /platform/tenants/{tenantId}:
    get:
      tags: [Platform - Tenants]
      summary: Get tenant details
      description: Returns tenant profile, all clinics, and its current subscription with payment history.
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tenant details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    allOf:
                      - { $ref: "../../openapi.yaml#/components/schemas/Tenant" }
                      - type: object
                        properties:
                          clinics: { type: array, items: { $ref: "../../openapi.yaml#/components/schemas/Clinic" } }
                          subscription: { allOf: [{ $ref: "../../openapi.yaml#/components/schemas/Subscription" }], nullable: true }
        "404": { $ref: "../../openapi.yaml#/components/responses/NotFound" }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
    patch:
      tags: [Platform - Tenants]
      summary: Partially update tenant profile
      description: All supplied fields are updated. Nested objects are merged. Changing name regenerates the server-controlled slug.
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../openapi.yaml#/components/schemas/TenantUpdate" }
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../openapi.yaml#/components/schemas/TenantDetails" }
        "404": { $ref: "../../openapi.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../openapi.yaml#/components/responses/ValidationError" }
  /platform/tenants/{tenantId}/status:
    patch:
      tags: [Platform - Tenants]
      summary: Update tenant status
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        "200":
          description: Tenant status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../openapi.yaml#/components/schemas/TenantDetails" }
        "404": { $ref: "../../openapi.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../openapi.yaml#/components/responses/ValidationError" }
  /platform/tenants/{tenantId}/subscription:
    put:
      tags: [Platform - Tenants]
      summary: Create or replace tenant subscription
      description: Stores the commercial subscription snapshot. No payment gateway is charged by this endpoint.
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../openapi.yaml#/components/schemas/SubscriptionInput" }
      responses:
        "200":
          description: Subscription saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../openapi.yaml#/components/schemas/Subscription" }
        "404": { $ref: "../../openapi.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../openapi.yaml#/components/responses/ValidationError" }
  /platform/tenants/{tenantId}/subscription/payments:
    post:
      tags: [Platform - Tenants]
      summary: Record a subscription payment
      description: Appends a payment record to subscription history; this does not initiate a payment.
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../openapi.yaml#/components/schemas/SubscriptionPaymentInput" }
      responses:
        "201":
          description: Payment record appended
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../openapi.yaml#/components/schemas/SubscriptionPayment" }
        "404": { $ref: "../../openapi.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../openapi.yaml#/components/responses/ValidationError" }
