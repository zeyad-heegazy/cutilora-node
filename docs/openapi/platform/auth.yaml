openapi: 3.0.3
paths:
  /auth/platform/login:
    post:
      tags: [Platform - Authentication]
      summary: Platform administrator login
      description: Issues a platform-audience access token only to an active platform administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Platform login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      access_token: { type: string }
                      token_type: { type: string, example: Bearer }
                      user: { $ref: "../../openapi.yaml#/components/schemas/UserSummary" }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
  /auth/platform/me:
    get:
      tags: [Platform - Authentication]
      summary: Get current platform administrator
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current platform identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, properties: { user: { $ref: "../../openapi.yaml#/components/schemas/UserSummary" } } }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
  /auth/platform/dev/bootstrap-admin:
    post:
      tags: [Platform - Authentication]
      summary: Bootstrap the first platform administrator
      description: Development/test only. Route is not registered in production. Can be used only while no platform admin exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
      responses:
        "201":
          description: Platform admin created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string, format: email }
        "409": { $ref: "../../openapi.yaml#/components/responses/Conflict" }
        "422": { $ref: "../../openapi.yaml#/components/responses/ValidationError" }
