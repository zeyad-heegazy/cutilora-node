openapi: 3.0.3
paths:
  /platform/monitoring/view:
    get:
      tags: [Portal Platform]
      summary: Open monitoring dashboard
      description: Serves the browser-based dashboard. Log API endpoints require platform authentication.
      responses:
        "200":
          description: Monitoring dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /platform/monitoring/logs:
    get:
      tags: [Platform - Monitoring]
      summary: List application logs
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error, fatal] } }
        - { name: category, in: query, schema: { type: string, enum: [http, auth, authorization, database, business, security, system, application] } }
        - { name: module, in: query, schema: { type: string } }
        - { name: statusCode, in: query, schema: { type: integer, minimum: 100, maximum: 599 } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, description: Inclusive ISO-8601 date/time, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Inclusive ISO-8601 date/time, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Matching log records and pagination data
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean }, data: { type: object, description: Log list and pagination result } } }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
  /platform/monitoring/logs/stats:
    get:
      tags: [Platform - Monitoring]
      summary: Get log statistics
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { name: from, in: query, description: Inclusive ISO-8601 date/time; defaults to seven days before to, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Inclusive ISO-8601 date/time; defaults to current time, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Log statistics for the requested date range
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean }, data: { type: object } } }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
  /platform/monitoring/logs/timeline:
    get:
      tags: [Platform - Monitoring]
      summary: Get log timeline statistics
      description: Currently returns the same aggregate statistics payload as the stats endpoint, not time-bucketed points.
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Aggregate log statistics
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean }, data: { type: object } } }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
  /platform/monitoring/logs/{id}:
    get:
      tags: [Platform - Monitoring]
      summary: Get a log entry
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Log entry
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean }, data: { type: object } } }
        "400": { $ref: "../../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../../openapi.yaml#/components/responses/NotFound" }
