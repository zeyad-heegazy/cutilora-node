openapi: 3.0.3
paths:
  /platform/geo/countries:
    get:
      tags: [Platform - Geo]
      summary: List countries
      description: Platform administrator only. Supports pagination and search by English name, Arabic name, or code.
      security: [{ platformBearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
        - name: search
          in: query
          description: Case-insensitive search across English name, Arabic name, and code.
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Paginated countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    {
                      type: array,
                      items: { $ref: "../../openapi.yaml#/components/schemas/GeoEntry" },
                    }
                  meta: { $ref: "../../openapi.yaml#/components/schemas/Pagination" }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Platform - Geo]
      summary: Create country
      security: [{ platformBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../openapi.yaml#/components/schemas/CountryInput" }
      responses:
        "201":
          description: Country created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../openapi.yaml#/components/schemas/GeoEntry" }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
        "422": { $ref: "../../openapi.yaml#/components/responses/ValidationError" }
  /platform/geo/countries/{countryId}:
    parameters:
      - name: countryId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Platform - Geo]
      summary: Get country by ID
      security: [{ platformBearerAuth: [] }]
      responses:
        "200":
          description: Country details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../openapi.yaml#/components/schemas/GeoEntry" }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../openapi.yaml#/components/responses/NotFound" }
    patch:
      tags: [Platform - Geo]
      summary: Update country
      security: [{ platformBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../../openapi.yaml#/components/schemas/CountryUpdate" }
      responses:
        "200":
          description: Country updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../openapi.yaml#/components/schemas/GeoEntry" }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../openapi.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../openapi.yaml#/components/responses/ValidationError" }
    delete:
      tags: [Platform - Geo]
      summary: Delete country
      security: [{ platformBearerAuth: [] }]
      responses:
        "200":
          description: Country deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string, example: Geo entry deleted. }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../../openapi.yaml#/components/responses/Conflict" }
