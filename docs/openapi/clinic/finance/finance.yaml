paths:
  /clinic/finance/summary:
    get:
      tags: [Clinic Finance]
      summary: Get financial summary grouped by currency
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - $ref: "../../../openapi.yaml#/components/parameters/BranchId"
      responses:
        '200': { description: Currency-separated clinic financial summary }
  /clinic/invoices:
    get:
      tags: [Clinic Finance]
      summary: List clinic invoices
      responses:
        '200': { description: Paginated clinic invoices }
    post:
      tags: [Clinic Finance]
      summary: Create a draft clinic invoice; an idempotencyKey is required
      responses:
        '201': { description: Draft invoice created }
  /clinic/invoices/{invoiceId}:
    parameters:
      - in: path
        name: invoiceId
        required: true
        schema: { type: string }
    get:
      tags: [Clinic Finance]
      summary: Get a clinic invoice
      responses:
        '200': { description: Invoice }
        '404': { description: Invoice not found }
    patch:
      tags: [Clinic Finance]
      summary: Update a draft invoice
      responses:
        '200': { description: Updated invoice }
  /clinic/invoices/{invoiceId}/issue:
    post:
      tags: [Clinic Finance]
      summary: Issue a draft invoice and allocate its number
      responses:
        '200': { description: Issued invoice }
  /clinic/invoices/{invoiceId}/payments:
    post:
      tags: [Clinic Finance]
      summary: Record a full or partial patient payment; an idempotencyKey is required
      responses:
        '201': { description: Payment recorded }
  /clinic/invoices/{invoiceId}/payments/{paymentId}/refunds:
    parameters:
      - in: path
        name: invoiceId
        required: true
        schema: { type: string }
      - in: path
        name: paymentId
        required: true
        schema: { type: string }
    post:
      tags: [Clinic Finance]
      summary: Refund all or part of an invoice payment; an idempotencyKey is required
      responses:
        '200': { description: Refund recorded }
  /clinic/invoices/{invoiceId}/void:
    post:
      tags: [Clinic Finance]
      summary: Void an unpaid invoice
      responses:
        '200': { description: Invoice voided }
  /clinic/expenses:
    get:
      tags: [Clinic Finance]
      summary: List clinic expenses
      responses:
        '200': { description: Paginated expenses }
    post:
      tags: [Clinic Finance]
      summary: Record a clinic expense; an idempotencyKey is required
      responses:
        '201': { description: Expense recorded }
  /clinic/expenses/{expenseId}/pay:
    post:
      tags: [Clinic Finance]
      summary: Mark a recorded expense as paid
      responses:
        '200': { description: Expense paid }
  /clinic/expenses/{expenseId}/void:
    post:
      tags: [Clinic Finance]
      summary: Void an unpaid expense
      responses:
        '200': { description: Expense voided }

  /clinic/cash-sessions/open:
    get:
      tags: [Clinic Finance]
      summary: Get the active cash session for the selected clinic/branch
      responses:
        '200': { description: Active cash session or null }
  /clinic/cash-sessions:
    post:
      tags: [Clinic Finance]
      summary: Open a cash session
      responses:
        '201': { description: Cash session opened }
  /clinic/cash-sessions/{sessionId}/movements:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema: { type: string }
    post:
      tags: [Clinic Finance]
      summary: Record an idempotent cash-in or cash-out movement
      responses:
        '200': { description: Cash movement recorded }
  /clinic/cash-sessions/{sessionId}/close:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema: { type: string }
    post:
      tags: [Clinic Finance]
      summary: Submit counted cash for independent review
      responses:
        '200': { description: Cash session submitted for review }
  /clinic/cash-sessions/{sessionId}/approve:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema: { type: string }
    post:
      tags: [Clinic Finance]
      summary: Approve and lock a cash session; opener/closer cannot approve
      responses:
        '200': { description: Cash session approved and locked }

  /clinic/finance/receivables:
    get:
      tags: [Clinic Finance]
      summary: Get aggregate receivables aging by currency
      parameters:
        - $ref: "../../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../../openapi.yaml#/components/parameters/ClinicIdRequired"
        - $ref: "../../../openapi.yaml#/components/parameters/BranchId"
      responses:
        '200': { description: Aggregate outstanding balances by aging bucket and currency; no patient details }
  /clinic/finance/reports:
    get:
      tags: [Clinic Finance]
      summary: Get clinic financial reports for a bounded date range
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: groupBy
          required: false
          schema: { type: string, enum: [day, month], default: day }
      responses:
        '200': { description: Currency-separated collection, expense, service-revenue and trend summaries }

  /clinic/invoices/{invoiceId}/credit-notes:
    parameters:
      - in: path
        name: invoiceId
        required: true
        schema: { type: string }
    post:
      tags: [Clinic Finance]
      summary: Issue an idempotent credit note against an issued invoice
      responses:
        '201': { description: Credit note issued and invoice balance recalculated }
