openapi: 3.0.3
paths:
  /tenant/clinics:
    get:
      tags: [Clinic - Clinics]
      summary: List clinics in current tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../openapi.yaml#/components/parameters/ClinicId"
        - $ref: "../../openapi.yaml#/components/parameters/BranchId"
      responses:
        "200":
          description: Clinic list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    {
                      type: array,
                      items: { $ref: "../../openapi.yaml#/components/schemas/Clinic" },
                    }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Clinic - Clinics]
      summary: Create clinic
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../openapi.yaml#/components/parameters/ClinicId"
        - $ref: "../../openapi.yaml#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string, minLength: 2 }
                slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
                timezone: { type: string, default: Africa/Cairo }
                countryId: { type: string }
                governorateId: { type: string }
                cityId: { type: string }
                districtId: { type: string }
      responses:
        "201":
          description: Clinic created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../openapi.yaml#/components/schemas/Clinic" }
        "400": { $ref: "../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
        "422": { $ref: "../../openapi.yaml#/components/responses/ValidationError" }
