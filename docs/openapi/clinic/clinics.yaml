openapi: 3.0.3
paths:
  /tenant/clinics:
    get:
      tags: [Clinic - Clinics]
      summary: List clinics in current tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../openapi.yaml#/components/parameters/ClinicId"
        - $ref: "../../openapi.yaml#/components/parameters/BranchId"
      responses:
        "200":
          description: Clinic list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    {
                      type: array,
                      items: { $ref: "../../openapi.yaml#/components/schemas/Clinic" },
                    }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Clinic - Clinics]
      summary: Create clinic; slug is generated by the server from the clinic name
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../../openapi.yaml#/components/parameters/ClinicId"
        - $ref: "../../openapi.yaml#/components/parameters/BranchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2 }
                timezone: { type: string, default: Africa/Cairo }
                countryId: { type: string }
                governorateId: { type: string }
                cityId: { type: string }
                districtId: { type: string }
      responses:
        "201":
          description: Clinic created with a server-generated unique slug within the tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../openapi.yaml#/components/schemas/Clinic" }
        "400": { $ref: "../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
        "422": { $ref: "../../openapi.yaml#/components/responses/ValidationError" }
  /tenant/clinics/{clinicId}:
    patch:
      tags: [Clinic - Clinics]
      summary: Update clinic; changing its name regenerates its slug
      security: [{ bearerAuth: [] }]
      parameters:
        - name: clinicId
          in: path
          required: true
          schema: { type: string }
        - $ref: "../../openapi.yaml#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 2 }
                timezone: { type: string }
                countryId: { type: string }
                governorateId: { type: string }
                cityId: { type: string }
                districtId: { type: string }
      responses:
        "200":
          description: Clinic updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "../../openapi.yaml#/components/schemas/Clinic" }
        "400": { $ref: "../../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../../openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../../openapi.yaml#/components/responses/NotFound" }
        "422": { $ref: "../../openapi.yaml#/components/responses/ValidationError" }
