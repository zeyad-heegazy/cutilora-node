openapi: 3.0.3
  /tenant/context:
    get:
      tags: [Tenant Context]
      summary: Resolve active tenant, clinic, and branch context
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/TenantId"
        - $ref: "../openapi.yaml#/components/parameters/ClinicId"
        - $ref: "../openapi.yaml#/components/parameters/BranchId"
      responses:
        "200":
          description: Resolved context and access scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      tenant: { type: object, nullable: true }
                      clinic: { type: object, nullable: true }
                      branch: { type: object, nullable: true }
                      access: { $ref: "../openapi.yaml#/components/schemas/TenantAccess" }
        "400": { $ref: "../openapi.yaml#/components/responses/BadRequest" }
        "401": { $ref: "../openapi.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "../openapi.yaml#/components/responses/Forbidden" }
