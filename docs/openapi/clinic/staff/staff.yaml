paths:
  /employees:
    get:
      tags: [Clinic Staff & Providers]
      summary: List clinic employees
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
        - { name: X-Branch-Id, in: header, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: Paginated clinic employee directory }
        "403": { $ref: "../../../openapi.yaml#/components/responses/Forbidden" }
    post:
      tags: [Clinic Staff & Providers]
      summary: Create a clinic employee profile
      description: Employee identity is independent from global login identity. userId optionally links an existing active global account and does not create a membership.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName]
              properties:
                employeeCode: { type: string, maxLength: 40 }
                firstName: { type: string, minLength: 1, maxLength: 80 }
                lastName: { type: string, minLength: 1, maxLength: 80 }
                displayName: { type: string, maxLength: 160 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 40 }
                jobTitle: { type: string, maxLength: 120 }
                employmentType: { type: string, enum: [full_time, part_time, contractor, temporary] }
                branchIds: { type: array, items: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
                userId: { type: string, nullable: true, pattern: "^[a-fA-F0-9]{24}$" }
                status: { type: string, enum: [active, inactive] }
      responses:
        "201": { description: Employee profile created }
        "400": { description: Invalid employee or branch assignment }
        "409": { description: Employee code or linked account already exists }
  /employees/{employeeId}:
    get:
      tags: [Clinic Staff & Providers]
      summary: Get an employee profile
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
        - { name: employeeId, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      responses:
        "200": { description: Employee profile }
        "404": { description: Employee not found in this clinic }
    patch:
      tags: [Clinic Staff & Providers]
      summary: Update an employee profile
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
        - { name: employeeId, in: path, required: true, schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string, maxLength: 80 }
                lastName: { type: string, maxLength: 80 }
                displayName: { type: string, maxLength: 160 }
                email: { type: string, format: email }
                phone: { type: string, maxLength: 40 }
                jobTitle: { type: string, maxLength: 120 }
                employmentType: { type: string, enum: [full_time, part_time, contractor, temporary] }
                branchIds: { type: array, items: { type: string } }
                userId: { type: string, nullable: true }
                status: { type: string, enum: [active, inactive] }
      responses:
        "200": { description: Employee profile updated }
        "404": { description: Employee not found in this clinic }
  /providers:
    get:
      tags: [Clinic Staff & Providers]
      summary: List clinic providers
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
        - { name: X-Branch-Id, in: header, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, suspended] } }
        - { name: specialtyId, in: query, schema: { type: string } }
        - { name: expiringWithinDays, in: query, schema: { type: integer, minimum: 1, maximum: 365 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200": { description: Paginated provider directory with linked employee summary }
    post:
      tags: [Clinic Staff & Providers]
      summary: Create a provider profile for an employee
      description: Provider branches must be active branches assigned to the employee. Expired licenses cannot be activated.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, branchIds]
              properties:
                employeeId: { type: string, pattern: "^[a-fA-F0-9]{24}$" }
                licenseNumber: { type: string, maxLength: 120 }
                licenseExpiresAt: { type: string, format: date-time, nullable: true }
                specialtyIds: { type: array, items: { type: string } }
                branchIds: { type: array, minItems: 1, items: { type: string } }
                serviceIds: { type: array, items: { type: string }, description: Opaque references until the Services module is implemented }
                workingHours:
                  type: array
                  maxItems: 7
                  items:
                    type: object
                    required: [dayOfWeek]
                    properties:
                      dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
                      isAvailable: { type: boolean }
                      startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
                      endTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
                      breaks: { type: array, items: { type: object, properties: { startTime: { type: string }, endTime: { type: string } } } }
                status: { type: string, enum: [active, inactive, suspended] }
      responses:
        "201": { description: Provider profile created }
        "400": { description: Employee, branch or specialty assignment is invalid }
        "409": { description: Employee already has a provider profile or license is expired }
  /providers/{providerId}:
    get:
      tags: [Clinic Staff & Providers]
      summary: Get a provider profile
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
        - { name: providerId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Provider profile }
        "404": { description: Provider not found in this clinic }
    patch:
      tags: [Clinic Staff & Providers]
      summary: Update provider license, specialties, assignments, schedule or status
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
        - { name: providerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                licenseNumber: { type: string, maxLength: 120 }
                licenseExpiresAt: { type: string, format: date-time, nullable: true }
                specialtyIds: { type: array, items: { type: string } }
                branchIds: { type: array, items: { type: string } }
                serviceIds: { type: array, items: { type: string } }
                workingHours: { type: array, maxItems: 7, items: { type: object } }
                status: { type: string, enum: [active, inactive, suspended] }
      responses:
        "200": { description: Provider profile updated }
        "404": { description: Provider not found in this clinic }
        "409": { description: Provider cannot be activated because the employee is inactive or license expired }
  /providers/{providerId}/branches:
    put:
      tags: [Clinic Staff & Providers]
      summary: Replace provider branch assignments
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
        - { name: providerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchIds]
              properties:
                branchIds: { type: array, minItems: 1, items: { type: string } }
      responses:
        "200": { description: Branch assignments replaced }
        "400": { description: Branch does not belong to this clinic or is inactive }
  /providers/{providerId}/services:
    put:
      tags: [Clinic Staff & Providers]
      summary: Replace provider service eligibility references
      description: Service references are stored as opaque identifiers until the Services module owns service validation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
        - { name: providerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceIds]
              properties:
                serviceIds: { type: array, items: { type: string } }
      responses:
        "200": { description: Service eligibility references replaced }
  /providers/{providerId}/working-hours:
    get:
      tags: [Clinic Staff & Providers]
      summary: Get provider weekly working hours
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
        - { name: providerId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Weekly provider availability in branch-local wall-clock values }
    put:
      tags: [Clinic Staff & Providers]
      summary: Replace provider weekly working hours
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
        - { name: providerId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workingHours]
              properties:
                workingHours: { type: array, maxItems: 7, items: { type: object } }
      responses:
        "200": { description: Working hours replaced }
        "400": { description: Invalid or overlapping weekly schedule }
  /specialties:
    get:
      tags: [Clinic Staff & Providers]
      summary: List active clinic specialties
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: Clinic specialties }
    post:
      tags: [Clinic Staff & Providers]
      summary: Create a clinic specialty
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../../../openapi.yaml#/components/parameters/TenantId" }
        - { name: X-Clinic-Id, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                code: { type: string, maxLength: 40 }
                description: { type: string, maxLength: 500 }
      responses:
        "201": { description: Specialty created }
