openapi: 3.0.3
info:
  title: Cutilora API
  version: 1.0.0
  description: |
    API documentation for the Cutilora Node.js backend.
    Base path: /api/v1.
    Authentication uses Bearer access tokens.
    Tenant-scoped endpoints require X-Tenant-Id. X-Clinic-Id selects an optional clinic context.
    X-Branch-Id selects a branch and requires X-Clinic-Id; branch-scoped memberships must select an authorized branch.
    The development bootstrap endpoint is unavailable when NODE_ENV=production.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (replace with deployed API URL)
tags:
  - name: Health
  - name: Portal Platform
  - name: Authentication
  - name: Tenant Context
  - name: Clinics
  - name: Branches
  - name: Clinic - Geo
  - name: Clinic Staff & Providers
  - name: Patients
