components:
  securitySchemes:
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform administrator access token. In Apidog, read the token from the platform_token environment variable.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Active tenant ID.
      schema: { type: string }
    ClinicId:
      name: X-Clinic-Id
      in: header
      required: false
      description: Active clinic ID.
      schema: { type: string }
    ClinicIdRequired:
      name: X-Clinic-Id
      in: header
      required: true
      description: Required for branch endpoints.
      schema: { type: string }
    BranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: Optional branch scope; requires X-Clinic-Id. Required for branch-scoped memberships.
      schema: { type: string }
    GeoResource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [countries, governorates, cities, districts]
  schemas:
    HealthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, example: ok }
    UserSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        platform_role: { type: string, nullable: true }
    MembershipSummary:
      type: object
      properties:
        tenant: { type: string }
        clinic: { type: string, nullable: true }
        branch_ids: { type: array, items: { type: string } }
        scope: { type: string, enum: [tenant, clinic, branch] }
        role: { type: string }
    TenantAccess:
      type: object
      properties:
        tenantId: { type: string }
        clinicId: { type: string, nullable: true }
        branchId: { type: string, nullable: true }
        role: { type: string }
        scope: { type: string, enum: [tenant, clinic, branch] }
    BusinessContact:
      type: object
      properties:
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        alternatePhone: { type: string, nullable: true }
        whatsapp: { type: string, nullable: true }
        website: { type: string, format: uri, nullable: true }
    BusinessAddress:
      type: object
      properties:
        countryId: { type: string, nullable: true }
        governorateId: { type: string, nullable: true }
        cityId: { type: string, nullable: true }
        districtId: { type: string, nullable: true }
        addressLine1: { type: string }
        addressLine2: { type: string }
        building: { type: string }
        floor: { type: string }
        unit: { type: string }
        landmark: { type: string }
        postalCode: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
    TenantLegal:
      type: object
      properties:
        taxNumber: { type: string }
        vatNumber: { type: string }
        commercialRegistrationNumber: { type: string }
    Branding:
      type: object
      properties:
        logoUrl: { type: string }
        coverImageUrl: { type: string }
        primaryColor: { type: string }
    TenantPreferences:
      type: object
      properties:
        timezone: { type: string }
        locale: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        dateFormat: { type: string }
        weekStartsOn: { type: integer, minimum: 0, maximum: 6 }
        supportedLanguages: { type: array, items: { type: string } }
    BrandingInput:
      type: object
      properties:
        logoBase64:
          type: string
          description: Base64 data URL for PNG, JPEG, or WebP. Maximum decoded size is 2 MB.
        coverImageBase64:
          type: string
          description: Base64 data URL for PNG, JPEG, or WebP. Maximum decoded size is 2 MB.
        primaryColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    Tenant:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        displayName: { type: string }
        legalName: { type: string }
        slug: { type: string }
        businessType: { type: string, enum: [single_clinic, clinic_group, medical_center] }
        description: { type: string }
        industry: { type: string }
        status: { type: string, enum: [active, suspended] }
        contact: { $ref: "#/components/schemas/BusinessContact" }
        address: { $ref: "#/components/schemas/BusinessAddress" }
        legal:
          type: object
          properties:
            taxNumber: { type: string }
            vatNumber: { type: string }
            commercialRegistrationNumber: { type: string }
        branding:
          type: object
          properties:
            logoUrl: { type: string }
            coverImageUrl: { type: string }
            primaryColor: { type: string }
        preferences:
          type: object
          properties:
            timezone: { type: string }
            locale: { type: string }
            currency: { type: string }
            dateFormat: { type: string }
            weekStartsOn: { type: integer }
            supportedLanguages: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TenantUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        displayName: { type: string, maxLength: 160 }
        legalName: { type: string, maxLength: 200 }
        businessType: { type: string, enum: [single_clinic, clinic_group, medical_center] }
        description: { type: string, maxLength: 2000 }
        industry: { type: string }
        contact: { $ref: "#/components/schemas/BusinessContact" }
        address: { $ref: "#/components/schemas/BusinessAddress" }
        legal: { $ref: "#/components/schemas/TenantLegal" }
        branding: { $ref: "#/components/schemas/BrandingInput" }
        preferences: { $ref: "#/components/schemas/TenantPreferences" }
    ClinicInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        code: { type: string, maxLength: 30 }
        clinicType: { type: string, enum: [dermatology, aesthetic, beauty, medical_center, other] }
        description: { type: string, maxLength: 2000 }
        specialties: { type: array, items: { type: string } }
        contact: { $ref: "#/components/schemas/BusinessContact" }
        address: { $ref: "#/components/schemas/BusinessAddress" }
        timezone: { type: string, default: Africa/Cairo }
        preferences: { $ref: "#/components/schemas/TenantPreferences" }
        settings: { type: object, additionalProperties: true, description: Clinic-specific custom settings }
        operatingHours:
          type: array
          maxItems: 7
          items:
            type: object
            required: [dayOfWeek]
            properties:
              dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
              isClosed: { type: boolean }
              openTime: { type: string }
              closeTime: { type: string }
              breakTimes: { type: array, items: { type: object, properties: { startTime: { type: string }, endTime: { type: string } } } }
        branding: { $ref: "#/components/schemas/BrandingInput" }
        bookingSettings:
          type: object
          properties:
            allowOnlineBooking: { type: boolean }
            requireAppointmentConfirmation: { type: boolean }
            defaultAppointmentDurationMinutes: { type: integer, minimum: 5, maximum: 480 }
            bufferMinutes: { type: integer, minimum: 0, maximum: 240 }
            cancellationWindowHours: { type: integer, minimum: 0, maximum: 720 }
        openingDate: { type: string, format: date, nullable: true }
    ClinicUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        status: { type: string, enum: [active, suspended] }
        code: { type: string, maxLength: 30 }
        clinicType: { type: string, enum: [dermatology, aesthetic, beauty, medical_center, other] }
        description: { type: string, maxLength: 2000 }
        specialties: { type: array, items: { type: string } }
        contact: { type: object, additionalProperties: true }
        address: { $ref: "#/components/schemas/BusinessAddress" }
        timezone: { type: string }
        preferences: { $ref: "#/components/schemas/TenantPreferences" }
        settings: { type: object, additionalProperties: true }
        countryId: { type: string, description: Optional legacy top-level location field accepted by PATCH }
        governorateId: { type: string }
        cityId: { type: string }
        districtId: { type: string }
        operatingHours: { type: array, items: { type: object, additionalProperties: true } }
        branding: { $ref: "#/components/schemas/BrandingInput" }
        bookingSettings: { type: object, additionalProperties: true }
        openingDate: { type: string, format: date, nullable: true }
    Clinic:
      allOf:
        - { $ref: "#/components/schemas/ClinicInput" }
        - type: object
          properties:
            _id: { type: string }
            tenantId: { type: string }
            slug: { type: string, readOnly: true }
            status: { type: string, enum: [active, suspended] }
            branding: { $ref: "#/components/schemas/Branding" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    TenantDetails:
      allOf:
        - { $ref: "#/components/schemas/Tenant" }
        - type: object
          properties:
            clinics: { type: array, items: { $ref: "#/components/schemas/Clinic" } }
            subscription:
              allOf:
                - { $ref: "#/components/schemas/Subscription" }
              nullable: true
    Subscription:
      type: object
      properties:
        _id: { type: string }
        tenantId: { type: string }
        plan:
          type: object
          properties:
            code: { type: string }
            name: { type: string }
            amount: { type: number }
            currency: { type: string }
            limits:
              type: object
              properties:
                maxClinics: { type: integer, minimum: 0, nullable: true }
                maxBranches: { type: integer, minimum: 0, nullable: true }
                maxUsers: { type: integer, minimum: 0, nullable: true }
                maxStorageBytes: { type: integer, minimum: 0, nullable: true }
            features: { type: array, items: { type: string } }
        billingCycle: { type: string, enum: [monthly, quarterly, yearly] }
        status: { type: string, enum: [pending, trialing, active, past_due, canceled, expired] }
        trialStartsAt: { type: string, format: date-time, nullable: true }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        currentPeriodStartsAt: { type: string, format: date-time, nullable: true }
        currentPeriodEndsAt: { type: string, format: date-time, nullable: true }
        nextBillingAt: { type: string, format: date-time, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        canceledAt: { type: string, format: date-time, nullable: true }
        paymentHistory: { type: array, items: { $ref: "#/components/schemas/SubscriptionPayment" } }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SubscriptionInput:
      type: object
      required: [plan]
      properties:
        plan:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
            amount: { type: number, minimum: 0 }
            currency: { type: string, minLength: 3, maxLength: 3 }
            limits:
              type: object
              properties:
                maxClinics: { type: integer, minimum: 0, nullable: true }
                maxBranches: { type: integer, minimum: 0, nullable: true }
                maxUsers: { type: integer, minimum: 0, nullable: true }
                maxStorageBytes: { type: integer, minimum: 0, nullable: true }
            features: { type: array, items: { type: string } }
        billingCycle: { type: string, enum: [monthly, quarterly, yearly] }
        status: { type: string, enum: [pending, trialing, active, past_due, canceled, expired] }
        trialStartsAt: { type: string, format: date-time, nullable: true }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        currentPeriodStartsAt: { type: string, format: date-time, nullable: true }
        currentPeriodEndsAt: { type: string, format: date-time, nullable: true }
        nextBillingAt: { type: string, format: date-time, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        canceledAt: { type: string, format: date-time, nullable: true }
        notes: { type: string }
    SubscriptionPayment:
      type: object
      properties:
        _id: { type: string }
        tenantId: { type: string }
        subscriptionId: { type: string }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [pending, paid, failed, refunded] }
        method: { type: string }
        provider: { type: string }
        providerReference: { type: string }
        invoiceNumber: { type: string }
        invoiceUrl: { type: string }
        paidAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string }
        recordedAt: { type: string, format: date-time }
    SubscriptionPaymentInput:
      type: object
      required: [amount, currency, status]
      properties:
        amount: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status: { type: string, enum: [pending, paid, failed, refunded] }
        method: { type: string }
        provider: { type: string }
        providerReference: { type: string }
        invoiceNumber: { type: string }
        invoiceUrl: { type: string, format: uri }
        paidAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string }
    OperatingHoursDay:
      type: object
      required: [dayOfWeek]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        isClosed: { type: boolean }
        openTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        closeTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        breakTimes:
          type: array
          maxItems: 5
          items:
            type: object
            required: [startTime, endTime]
            properties:
              startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
              endTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        shifts:
          type: array
          minItems: 1
          maxItems: 3
          description: Optional split shifts. Use either shifts or legacy openTime/closeTime fields, not both.
          items:
            type: object
            required: [startTime, endTime]
            properties:
              startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
              endTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
              breakTimes:
                type: array
                maxItems: 5
                items:
                  type: object
                  required: [startTime, endTime]
                  properties:
                    startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
                    endTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
    Branch:
      type: object
      properties:
        _id: { type: string }
        tenantId: { type: string }
        clinicId: { type: string }
        name: { type: string }
        code: { type: string, nullable: true }
        slug: { type: string }
        address: { type: string, nullable: true }
        addressDetails: { type: object, additionalProperties: true }
        contact: { type: object, additionalProperties: true }
        contactPerson: { type: object, additionalProperties: true }
        cityId: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        settings: { type: object, additionalProperties: true }
        openingDate: { type: string, format: date-time, nullable: true }
        timezone: { type: string }
        operatingHours: { type: array, items: { $ref: "#/components/schemas/OperatingHoursDay" } }
        status: { type: string, enum: [draft, active, temporarily_closed, suspended, closed] }
        closureReason: { type: string }
        temporarilyClosedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
    BranchUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        code: { type: string, maxLength: 30 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        address: { type: string, maxLength: 500 }
        addressDetails: { type: object, additionalProperties: true }
        contact: { type: object, additionalProperties: true }
        contactPerson: { type: object, additionalProperties: true }
        cityId: { type: string, nullable: true }
        postalCode: { type: string, maxLength: 30 }
        latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
        longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
        settings: { type: object, additionalProperties: true }
        openingDate: { type: string, format: date-time, nullable: true }
        timezone: { type: string, description: Valid IANA timezone }
        operatingHours: { type: array, maxItems: 7, items: { $ref: "#/components/schemas/OperatingHoursDay" } }
    CountryInput:
      type: object
      required: [name_en]
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255, example: Egypt }
        name_ar: { type: string, nullable: true, maxLength: 255, example: مصر }
        code:
          {
            type: string,
            minLength: 2,
            maxLength: 2,
            pattern: "^[A-Z]{2}$",
            example: EG,
          }
    CountryUpdate:
      type: object
      description: All fields are optional for PATCH.
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        code:
          { type: string, minLength: 2, maxLength: 2, pattern: "^[A-Z]{2}$" }
    GovernorateInput:
      type: object
      required: [name_en, country_id]
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        country_id:
          { type: string, description: Parent country MongoDB ObjectId }
    GovernorateUpdate:
      type: object
      description: All fields are optional for PATCH.
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        country_id: { type: string }
    CityInput:
      type: object
      required: [name_en, governorate_id]
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        governorate_id:
          { type: string, description: Parent governorate MongoDB ObjectId }
    CityUpdate:
      type: object
      description: All fields are optional for PATCH.
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        governorate_id: { type: string }
    DistrictInput:
      type: object
      required: [name_en, city_id]
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        city_id: { type: string, description: Parent city MongoDB ObjectId }
    DistrictUpdate:
      type: object
      description: All fields are optional for PATCH.
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        city_id: { type: string }
    GeoParent:
      type: object
      properties:
        id: { type: string }
        name_en: { type: string }
        name_ar: { type: string, nullable: true }
        code: { type: string, nullable: true }
        country:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
        governorate:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
        city:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
    GeoEntry:
      type: object
      properties:
        id: { type: string }
        name_en: { type: string }
        name_ar: { type: string, nullable: true }
        code: { type: string, nullable: true }
        country:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
        governorate:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
        city:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object, properties: { path: { type: string }, message: { type: string } } } }
  responses:
    BadRequest:
      description: Bad request or invalid identifier/context
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Authenticated user lacks required access
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: Duplicate resource or resource is in use
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }