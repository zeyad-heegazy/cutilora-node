openapi: 3.0.3
info:
  title: Cutilora API
  version: 1.0.0
  description: |
    API documentation for the Cutilora Node.js backend.
    Base path: /api/v1.
    Authentication uses Bearer access tokens.
    Tenant-scoped endpoints require X-Tenant-Id. X-Clinic-Id and X-Branch-Id
    select optional clinic and branch context; branch context requires clinic context.
    The development bootstrap endpoint is unavailable when NODE_ENV=production.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (replace with deployed API URL)
tags:
  - name: Health
  - name: Clinic - Authentication
  - name: Platform - Authentication
  - name: Platform - Tenants
  - name: Platform - Geo
  - name: Platform - Monitoring
  - name: Clinic - Context
  - name: Clinic - Geo
  - name: Clinic - Clinics
  - name: Clinic - Branches
paths:
  /health:
    $ref: "./openapi/system/health.yaml#/paths/~1health"
  /auth/login:
    $ref: "./openapi/clinic/auth.yaml#/paths/~1auth~1login"
  /auth/me:
    $ref: "./openapi/clinic/auth.yaml#/paths/~1auth~1me"
  /auth/platform/login:
    $ref: "./openapi/platform/auth.yaml#/paths/~1auth~1platform~1login"
  /auth/platform/me:
    $ref: "./openapi/platform/auth.yaml#/paths/~1auth~1platform~1me"
  /auth/platform/dev/bootstrap-admin:
    $ref: "./openapi/platform/auth.yaml#/paths/~1auth~1platform~1dev~1bootstrap-admin"
  /platform/tenants:
    $ref: "./openapi/platform/tenants.yaml#/paths/~1platform~1tenants"
  /platform/tenants/{tenantId}:
    $ref: "./openapi/platform/tenants.yaml#/paths/~1platform~1tenants~1{tenantId}"
  /platform/tenants/{tenantId}/status:
    $ref: "./openapi/platform/tenants.yaml#/paths/~1platform~1tenants~1{tenantId}~1status"
  /platform/tenants/{tenantId}/subscription:
    $ref: "./openapi/platform/tenants.yaml#/paths/~1platform~1tenants~1{tenantId}~1subscription"
  /platform/tenants/{tenantId}/subscription/payments:
    $ref: "./openapi/platform/tenants.yaml#/paths/~1platform~1tenants~1{tenantId}~1subscription~1payments"
  /platform/geo/countries:
    $ref: "./openapi/platform/geo.yaml#/paths/~1platform~1geo~1countries"
  /platform/geo/countries/{countryId}:
    $ref: "./openapi/platform/geo.yaml#/paths/~1platform~1geo~1countries~1{countryId}"
  /platform/geo/governorates:
    $ref: "./openapi/platform/geo.yaml#/paths/~1platform~1geo~1governorates"
  /platform/geo/governorates/{governorateId}:
    $ref: "./openapi/platform/geo.yaml#/paths/~1platform~1geo~1governorates~1{governorateId}"
  /platform/geo/cities:
    $ref: "./openapi/platform/geo.yaml#/paths/~1platform~1geo~1cities"
  /platform/geo/cities/{cityId}:
    $ref: "./openapi/platform/geo.yaml#/paths/~1platform~1geo~1cities~1{cityId}"
  /platform/geo/districts:
    $ref: "./openapi/platform/geo.yaml#/paths/~1platform~1geo~1districts"
  /platform/geo/districts/{districtId}:
    $ref: "./openapi/platform/geo.yaml#/paths/~1platform~1geo~1districts~1{districtId}"
  /tenant/geo/countries:
    $ref: "./openapi/clinic/geo.yaml#/paths/~1tenant~1geo~1countries"
  /tenant/geo/governorates:
    $ref: "./openapi/clinic/geo.yaml#/paths/~1tenant~1geo~1governorates"
  /tenant/geo/cities:
    $ref: "./openapi/clinic/geo.yaml#/paths/~1tenant~1geo~1cities"
  /tenant/geo/districts:
    $ref: "./openapi/clinic/geo.yaml#/paths/~1tenant~1geo~1districts"
  /tenant/context:
    $ref: "./openapi/clinic/context.yaml#/paths/~1tenant~1context"
  /tenant/clinics:
    $ref: "./openapi/clinic/clinics.yaml#/paths/~1tenant~1clinics"
  /tenant/branches:
    $ref: "./openapi/clinic/branches.yaml#/paths/~1tenant~1branches"
  /platform/monitoring/view:
    $ref: "./openapi/platform/monitoring.yaml#/paths/~1platform~1monitoring~1view"
  /platform/monitoring/logs:
    $ref: "./openapi/platform/monitoring.yaml#/paths/~1platform~1monitoring~1logs"
  /platform/monitoring/logs/stats:
    $ref: "./openapi/platform/monitoring.yaml#/paths/~1platform~1monitoring~1logs~1stats"
  /platform/monitoring/logs/timeline:
    $ref: "./openapi/platform/monitoring.yaml#/paths/~1platform~1monitoring~1logs~1timeline"
  /platform/monitoring/logs/{id}:
    $ref: "./openapi/platform/monitoring.yaml#/paths/~1platform~1monitoring~1logs~1{id}"
components:
  securitySchemes:
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform administrator access token. In Apidog, read the token from the platform_token environment variable.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Active tenant ID.
      schema: { type: string }
    ClinicId:
      name: X-Clinic-Id
      in: header
      required: false
      description: Active clinic ID.
      schema: { type: string }
    ClinicIdRequired:
      name: X-Clinic-Id
      in: header
      required: true
      description: Required for branch endpoints.
      schema: { type: string }
    BranchId:
      name: X-Branch-Id
      in: header
      required: false
      description: Optional branch scope; requires X-Clinic-Id.
      schema: { type: string }
    GeoResource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [countries, governorates, cities, districts]
  schemas:
    HealthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            status: { type: string, example: ok }
    UserSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        platform_role: { type: string, nullable: true }
    MembershipSummary:
      type: object
      properties:
        tenant: { type: string }
        clinic: { type: string, nullable: true }
        branch_ids: { type: array, items: { type: string } }
        scope: { type: string, enum: [tenant, clinic, branch] }
        role: { type: string }
    TenantAccess:
      type: object
      properties:
        tenantId: { type: string }
        clinicId: { type: string, nullable: true }
        branchId: { type: string, nullable: true }
        role: { type: string }
        scope: { type: string, enum: [tenant, clinic, branch] }
    BusinessContact:
      type: object
      properties:
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        alternatePhone: { type: string, nullable: true }
        whatsapp: { type: string, nullable: true }
        website: { type: string, format: uri, nullable: true }
    BusinessAddress:
      type: object
      properties:
        countryId: { type: string, nullable: true }
        governorateId: { type: string, nullable: true }
        cityId: { type: string, nullable: true }
        districtId: { type: string, nullable: true }
        addressLine1: { type: string }
        addressLine2: { type: string }
        building: { type: string }
        floor: { type: string }
        unit: { type: string }
        landmark: { type: string }
        postalCode: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
    TenantLegal:
      type: object
      properties:
        taxNumber: { type: string }
        vatNumber: { type: string }
        commercialRegistrationNumber: { type: string }
    Branding:
      type: object
      properties:
        logoUrl: { type: string }
        coverImageUrl: { type: string }
        primaryColor: { type: string }
    TenantPreferences:
      type: object
      properties:
        timezone: { type: string }
        locale: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        dateFormat: { type: string }
        weekStartsOn: { type: integer, minimum: 0, maximum: 6 }
        supportedLanguages: { type: array, items: { type: string } }
    Tenant:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        displayName: { type: string }
        legalName: { type: string }
        slug: { type: string }
        businessType: { type: string, enum: [single_clinic, clinic_group, medical_center] }
        description: { type: string }
        industry: { type: string }
        status: { type: string, enum: [active, suspended] }
        contact: { $ref: "#/components/schemas/BusinessContact" }
        address: { $ref: "#/components/schemas/BusinessAddress" }
        legal:
          type: object
          properties:
            taxNumber: { type: string }
            vatNumber: { type: string }
            commercialRegistrationNumber: { type: string }
        branding:
          type: object
          properties:
            logoUrl: { type: string }
            coverImageUrl: { type: string }
            primaryColor: { type: string }
        preferences:
          type: object
          properties:
            timezone: { type: string }
            locale: { type: string }
            currency: { type: string }
            dateFormat: { type: string }
            weekStartsOn: { type: integer }
            supportedLanguages: { type: array, items: { type: string } }
        settings: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TenantUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        displayName: { type: string, maxLength: 160 }
        legalName: { type: string, maxLength: 200 }
        businessType: { type: string, enum: [single_clinic, clinic_group, medical_center] }
        description: { type: string, maxLength: 2000 }
        industry: { type: string }
        contact: { $ref: "#/components/schemas/BusinessContact" }
        address: { $ref: "#/components/schemas/BusinessAddress" }
        legal: { type: object, additionalProperties: true }
        branding: { type: object, additionalProperties: true }
        preferences: { type: object, additionalProperties: true }
        settings: { type: object, additionalProperties: true }
    ClinicInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        code: { type: string, maxLength: 30 }
        clinicType: { type: string, enum: [dermatology, aesthetic, beauty, medical_center, other] }
        description: { type: string, maxLength: 2000 }
        specialties: { type: array, items: { type: string } }
        contact: { $ref: "#/components/schemas/BusinessContact" }
        address: { $ref: "#/components/schemas/BusinessAddress" }
        timezone: { type: string, default: Africa/Cairo }
        countryId: { type: string }
        governorateId: { type: string }
        cityId: { type: string }
        districtId: { type: string }
        operatingHours:
          type: array
          maxItems: 7
          items:
            type: object
            required: [dayOfWeek]
            properties:
              dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
              isClosed: { type: boolean }
              openTime: { type: string }
              closeTime: { type: string }
              breakTimes: { type: array, items: { type: object, properties: { startTime: { type: string }, endTime: { type: string } } } }
        branding: { type: object, additionalProperties: true }
        bookingSettings:
          type: object
          properties:
            allowOnlineBooking: { type: boolean }
            requireAppointmentConfirmation: { type: boolean }
            defaultAppointmentDurationMinutes: { type: integer, minimum: 5, maximum: 480 }
            bufferMinutes: { type: integer, minimum: 0, maximum: 240 }
            cancellationWindowHours: { type: integer, minimum: 0, maximum: 720 }
        openingDate: { type: string, format: date, nullable: true }
        settings: { type: object, additionalProperties: true }
    ClinicUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        status: { type: string, enum: [active, suspended] }
        code: { type: string, maxLength: 30 }
        clinicType: { type: string, enum: [dermatology, aesthetic, beauty, medical_center, other] }
        description: { type: string, maxLength: 2000 }
        specialties: { type: array, items: { type: string } }
        contact: { type: object, additionalProperties: true }
        address: { $ref: "#/components/schemas/BusinessAddress" }
        timezone: { type: string }
        countryId: { type: string }
        governorateId: { type: string }
        cityId: { type: string }
        districtId: { type: string }
        operatingHours: { type: array, items: { type: object, additionalProperties: true } }
        branding: { type: object, additionalProperties: true }
        bookingSettings: { type: object, additionalProperties: true }
        openingDate: { type: string, format: date, nullable: true }
        settings: { type: object, additionalProperties: true }
    Clinic:
      allOf:
        - { $ref: "#/components/schemas/ClinicInput" }
        - type: object
          properties:
            _id: { type: string }
            tenantId: { type: string }
            slug: { type: string, readOnly: true }
            status: { type: string, enum: [active, suspended] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    TenantDetails:
      allOf:
        - { $ref: "#/components/schemas/Tenant" }
        - type: object
          properties:
            clinics: { type: array, items: { $ref: "#/components/schemas/Clinic" } }
            subscription:
              allOf:
                - { $ref: "#/components/schemas/Subscription" }
              nullable: true
    Subscription:
      type: object
      properties:
        _id: { type: string }
        tenantId: { type: string }
        plan:
          type: object
          properties:
            code: { type: string }
            name: { type: string }
            amount: { type: number }
            currency: { type: string }
        billingCycle: { type: string, enum: [monthly, quarterly, yearly] }
        status: { type: string, enum: [pending, trialing, active, past_due, canceled, expired] }
        trialStartsAt: { type: string, format: date-time, nullable: true }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        currentPeriodStartsAt: { type: string, format: date-time, nullable: true }
        currentPeriodEndsAt: { type: string, format: date-time, nullable: true }
        nextBillingAt: { type: string, format: date-time, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        canceledAt: { type: string, format: date-time, nullable: true }
        paymentHistory: { type: array, items: { $ref: "#/components/schemas/SubscriptionPayment" } }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SubscriptionInput:
      type: object
      required: [plan]
      properties:
        plan:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
            amount: { type: number, minimum: 0 }
            currency: { type: string, minLength: 3, maxLength: 3 }
        billingCycle: { type: string, enum: [monthly, quarterly, yearly] }
        status: { type: string, enum: [pending, trialing, active, past_due, canceled, expired] }
        trialStartsAt: { type: string, format: date-time, nullable: true }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        currentPeriodStartsAt: { type: string, format: date-time, nullable: true }
        currentPeriodEndsAt: { type: string, format: date-time, nullable: true }
        nextBillingAt: { type: string, format: date-time, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        canceledAt: { type: string, format: date-time, nullable: true }
        notes: { type: string }
    SubscriptionPayment:
      type: object
      properties:
        _id: { type: string }
        tenantId: { type: string }
        subscriptionId: { type: string }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [pending, paid, failed, refunded] }
        method: { type: string }
        provider: { type: string }
        providerReference: { type: string }
        invoiceNumber: { type: string }
        invoiceUrl: { type: string }
        paidAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string }
        recordedAt: { type: string, format: date-time }
    SubscriptionPaymentInput:
      type: object
      required: [amount, currency, status]
      properties:
        amount: { type: number, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status: { type: string, enum: [pending, paid, failed, refunded] }
        method: { type: string }
        provider: { type: string }
        providerReference: { type: string }
        invoiceNumber: { type: string }
        invoiceUrl: { type: string, format: uri }
        paidAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string }
    Branch:
      type: object
      properties:
        _id: { type: string }
        tenantId: { type: string }
        clinicId: { type: string }
        name: { type: string }
        slug: { type: string }
        address: { type: string, nullable: true }
        cityId: { type: string, nullable: true }
        timezone: { type: string }
        status: { type: string }
    CountryInput:
      type: object
      required: [name_en]
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255, example: Egypt }
        name_ar: { type: string, nullable: true, maxLength: 255, example: مصر }
        code:
          {
            type: string,
            minLength: 2,
            maxLength: 2,
            pattern: "^[A-Z]{2}$",
            example: EG,
          }
    CountryUpdate:
      type: object
      description: All fields are optional for PATCH.
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        code:
          { type: string, minLength: 2, maxLength: 2, pattern: "^[A-Z]{2}$" }
    GovernorateInput:
      type: object
      required: [name_en, country_id]
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        country_id:
          { type: string, description: Parent country MongoDB ObjectId }
    GovernorateUpdate:
      type: object
      description: All fields are optional for PATCH.
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        country_id: { type: string }
    CityInput:
      type: object
      required: [name_en, governorate_id]
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        governorate_id:
          { type: string, description: Parent governorate MongoDB ObjectId }
    CityUpdate:
      type: object
      description: All fields are optional for PATCH.
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        governorate_id: { type: string }
    DistrictInput:
      type: object
      required: [name_en, city_id]
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        city_id: { type: string, description: Parent city MongoDB ObjectId }
    DistrictUpdate:
      type: object
      description: All fields are optional for PATCH.
      properties:
        name_en: { type: string, minLength: 1, maxLength: 255 }
        name_ar: { type: string, nullable: true, maxLength: 255 }
        city_id: { type: string }
    GeoParent:
      type: object
      properties:
        id: { type: string }
        name_en: { type: string }
        name_ar: { type: string, nullable: true }
        code: { type: string, nullable: true }
        country:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
        governorate:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
        city:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
    GeoEntry:
      type: object
      properties:
        id: { type: string }
        name_en: { type: string }
        name_ar: { type: string, nullable: true }
        code: { type: string, nullable: true }
        country:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
        governorate:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
        city:
          allOf:
            - { $ref: "#/components/schemas/GeoParent" }
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
  responses:
    BadRequest:
      description: Bad request or invalid identifier/context
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Authenticated user lacks required access
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: Duplicate resource or resource is in use
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

